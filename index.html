<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>医学细胞生物学闪卡</title>
  <style>
    /* ============ 医学细胞生物学闪卡 ============ */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg1: #edf3f5; --bg2: #f7f4ef;
      --card: #ffffff;
      --border: #dde6ea;
      --border-strong: #c8d6dc;
      --text: #2c3a44;
      --text-soft: #56656f;
      --muted: #8ba0ab;
      --accent: #2e8fa3;
      --accent-strong: #237a8c;
      --accent-soft: #e2f0f3;
      --mastered: #3f9d68; --mastered-bg: #e5f4eb; --mastered-border: #b5dfc6;
      --unmastered: #d98450; --unmastered-bg: #fbeedd; --unmastered-border: #efd0b2;
      --hot: #cf5b3a; --hot-bg: #fdeee8; --hot-border: #f2cdbd;
      --shadow: 0 2px 12px rgba(38, 60, 74, 0.08);
      --shadow-lg: 0 10px 30px rgba(38, 60, 74, 0.14);
      --topbar: rgba(255, 255, 255, 0.92);
    }
    [data-theme="dark"] {
      --bg1: #1b222c; --bg2: #22252e;
      --card: #27303c;
      --border: #39434f;
      --border-strong: #46525f;
      --text: #e2e9f0;
      --text-soft: #aeb9c4;
      --muted: #7d8b97;
      --accent: #56b5c9;
      --accent-strong: #6cc3d4;
      --accent-soft: #22353e;
      --mastered: #63c48d; --mastered-bg: #243a2d; --mastered-border: #355743;
      --unmastered: #e5a173; --unmastered-bg: #3b2f24; --unmastered-border: #57432f;
      --hot: #e37c5c; --hot-bg: #3c2b23; --hot-border: #5c3b2c;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.5);
      --topbar: rgba(30, 37, 47, 0.94);
    }

    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      background: linear-gradient(160deg, var(--bg1), var(--bg2));
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.3s, color 0.3s;
    }
    .hidden { display: none !important; }

    /* ---------- 顶栏：左上章节选择，右上统计 ---------- */
    .topbar {
      background: var(--topbar);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(6px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .topbar-inner {
      max-width: 1000px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .subject-select {
      flex: 0 0 auto;
      width: 300px;
      padding: 9px 12px;
      font-size: 15px;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
    }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .btn-ghost {
      padding: 8px 12px;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      background: var(--card);
      color: var(--text-soft);
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .import-msg { font-size: 12px; color: var(--muted); max-width: 240px; }

    .stats {
      margin-left: auto;
      display: flex;
      gap: 18px;
      font-size: 14px;
      color: var(--text-soft);
      white-space: nowrap;
    }
    .stats b { font-weight: 600; color: var(--text); }
    .num-mastered { color: var(--mastered); }
    .num-unmastered { color: var(--unmastered); }

    /* ---------- 主体 ---------- */
    .container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      flex: 1;
    }

    .filters { display: flex; align-items: center; gap: 18px; }
    .check {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: var(--text-soft);
      cursor: pointer;
      user-select: none;
    }
    .check input { cursor: pointer; accent-color: var(--accent); }

    /* ---------- 卡片 ---------- */
    .card-area { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .card-wrap { perspective: 1400px; width: 100%; max-width: 780px; }
    .card {
      position: relative;
      width: 100%;
      height: 440px;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.3, 0.7, 0.3, 1);
    }
    .card.flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      padding: 22px 30px;
      overflow: hidden;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    .card-back { transform: rotateY(180deg); }
    .card:not(.flipped):hover .card-front,
    .card.flipped:hover .card-back { border-color: var(--accent); box-shadow: var(--shadow-lg); }

    .badge-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex: none;
    }
    .corner { display: flex; gap: 8px; align-items: center; }
    .chapter-tag {
      font-size: 12px;
      color: var(--text-soft);
      background: var(--accent-soft);
      padding: 4px 12px;
      border-radius: 999px;
    }
    .hot-badge {
      font-size: 12px;
      color: var(--hot);
      background: var(--hot-bg);
      border: 1px solid var(--hot-border);
      padding: 4px 10px;
      border-radius: 999px;
    }
    .status-badge {
      display: none;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .status-badge.mastered {
      display: inline-block;
      color: var(--mastered);
      background: var(--mastered-bg);
      border: 1px solid var(--mastered-border);
    }
    .status-badge.unmastered {
      display: inline-block;
      color: var(--unmastered);
      background: var(--unmastered-bg);
      border: 1px solid var(--unmastered-border);
    }

    .card-text {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 27px;
      line-height: 1.7;
      overflow-y: auto;
      padding: 14px 4px;
      word-break: break-word;
    }
    /* 短内容垂直居中、长内容可从顶部滚动 */
    .card-text::before, .card-text::after { content: ""; margin: auto; flex: none; }
    .card-front .card-text { font-weight: 600; letter-spacing: 0.5px; }
    .card-back .card-text {
      font-size: 17px;
      text-align: left;
      line-height: 2;
      white-space: pre-line;
    }
    .card-text::-webkit-scrollbar { width: 6px; }
    .card-text::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

    .empty-tip { padding: 60px 0; color: var(--muted); font-size: 15px; }

    /* ---------- 控制区 ---------- */
    .controls { display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 6px; }
    .progress { font-size: 15px; color: var(--text); font-weight: 500; }
    .buttons { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .btn {
      padding: 12px 24px;
      border-radius: 10px;
      border: 1px solid var(--border-strong);
      background: var(--card);
      color: var(--text);
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s, background 0.15s, border-color 0.15s, color 0.15s;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow); }
    .btn:active { transform: translateY(0); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
    .btn-master { color: var(--mastered); border-color: var(--mastered-border); background: var(--mastered-bg); }
    .btn-master.active { background: var(--mastered); border-color: var(--mastered); color: #fff; }
    .btn-unmaster { color: var(--unmastered); border-color: var(--unmastered-border); background: var(--unmastered-bg); }
    .btn-unmaster.active { background: var(--unmastered); border-color: var(--unmastered); color: #fff; }

    /* ---------- 页脚 ---------- */
    .foot { text-align: center; color: var(--muted); font-size: 12px; padding: 18px 0 28px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <select id="subjectChapter" class="subject-select" title="选择科目和章节"></select>
      <div class="top-actions">
        <button id="importBtn" class="btn-ghost" title="导入 txt 文件，每行格式：概念|解释 或 概念：解释">导入TXT</button>
        <input type="file" id="importFile" accept=".txt,text/plain" hidden>
        <span id="importMsg" class="import-msg"></span>
        <button id="themeBtn" class="btn-ghost" title="切换深色/浅色模式">深色模式</button>
      </div>
      <div id="statsBar" class="stats"></div>
    </div>
  </header>

  <main class="container">
    <section class="filters">
      <label class="check" title="显示未掌握和未学习的卡片"><input type="checkbox" id="onlyUnmastered"> 只看未掌握</label>
      <label class="check" title="只显示历年高频考点卡片"><input type="checkbox" id="onlyHot"> 只看高频考点</label>
    </section>

    <section class="card-area">
      <div class="card-wrap" id="cardWrap">
        <div class="card" id="card">
          <div class="card-face card-front">
            <div class="badge-row">
              <span class="chapter-tag" id="chapterTag"></span>
              <span class="corner">
                <span class="hot-badge" id="hotBadge">🔥 高频考点</span>
                <span class="status-badge" id="frontBadge"></span>
              </span>
            </div>
            <div class="card-text" id="frontText"></div>
          </div>
          <div class="card-face card-back">
            <div class="badge-row">
              <span class="chapter-tag">解释</span>
              <span class="corner"><span class="status-badge" id="backBadge"></span></span>
            </div>
            <div class="card-text" id="backText"></div>
          </div>
        </div>
      </div>
      <div id="emptyTip" class="empty-tip hidden">当前筛选下暂无卡片</div>
    </section>

    <section class="controls">
      <div id="progress" class="progress"></div>
      <div class="buttons">
        <button id="prevBtn" class="btn">上一张</button>
        <button id="unmasteredBtn" class="btn btn-unmaster">✘ 未掌握</button>
        <button id="masteredBtn" class="btn btn-master">✔ 已掌握</button>
        <button id="nextBtn" class="btn btn-primary">下一张</button>
      </div>
    </section>
  </main>

  <footer class="foot">
    Copyright @ Jordamn
  </footer>

  <script>
// ===== 知识点数据库 =====
// 知识点直接在下面的 SUBJECTS 数组中编辑。
//
// 结构说明：
//   SUBJECTS         所有科目
//   ├─ id            科目唯一标识（添加新科目时改成一个新的 id）
//   ├─ name          科目名称（显示在顶部标签页）
//   └─ chapters      章节列表
//      ├─ name       章节名
//      └─ cards      卡片列表
//         ├─ front   正面 = 概念
//         ├─ back    背面 = 解释
//         └─ hot     （可选）true = 历年高频考点，卡片右上角显示 🔥 角标
//
// 添加新科目示例（复制整个科目对象，改 id/name，填入 chapters 即可）：
//   { id: "biochem", name: "生物化学", chapters: [ { name: "第一章", cards: [ { front: "…", back: "…" } ] } ] },
//
// 注意：内容中如需引号请使用中文引号 “ ”，避免与 JS 字符串引号冲突。

const SUBJECTS = [
  {
    id: "cell-bio",
    name: "医用细胞生物学",
    chapters: [
      {
        name: "绪论与研究方法",
        cards: [
          { front: "医学细胞生物学", back: "用细胞生物学的原理和方法研究人体细胞的结构、功能、生命活动规律及其与疾病关系的科学。" },
          { front: "细胞学说", hot: true, back: "由Schleiden和Schwann提出：所有生物体都由细胞构成；细胞是生命体结构和功能的基本单位；新的细胞源于已存在的细胞。" },
          { front: "光学显微镜由哪几部分组成", back: "由机械部分、光学部分和照明部分组成。" },
          { front: "显微镜分辨率公式", hot: true, back: "R = 0.61λ/N.A.，λ为入射光线波长，N.A.＝nsinα/2，n为介质折射率，α为物镜镜口张角。R越小，显微镜分辨本领越高。" },
          { front: "光镜与电镜的分辨率和放大倍数", back: "光镜最大分辨率0.2μm，最大放大倍数1000倍；电镜分辨率为0.2nm。" },
          { front: "荧光显微镜的特点和用途", back: "光源为短波光（紫外线），有两个特殊的滤光片，照明方式通常为落射式。用于研究组织和细胞特异蛋白等生物大分子的分布、细胞内物质吸收和运输规律等。" },
          { front: "相差显微镜的特点", back: "可以观察活细胞或未经染色标本的光学显微镜（一般生物学实验室里的是倒置相差显微镜）。" },
          { front: "激光共聚焦扫描显微镜的特点", back: "能显示细胞样品的立体结构。" },
          { front: "电子显微镜的组成", back: "以电子束作光源，电极或磁极作透镜，荧光屏代替肉眼；由镜体系统、真空系统和电子线路系统三大系统组成。" },
          { front: "配合透射电镜的样品制备技术", back: "超薄切片技术、冷冻超薄切片技术、负染技术、冰冻蚀刻技术等。" },
          { front: "扫描电子显微镜的特点", back: "用来观察标本表面结构，不需要制作切片。扫描隧道显微镜（由Binning和Rohrer发明）对固、液、气三态物质均可进行观察。" },
          { front: "三种离心法的用途", back: "差速离心法：根据颗粒大小和密度不同存在的沉降速度差别，分级增加离心力，从试样中依次分离不同组分，用于分离大小相差悬殊的样品。移动区带离心法：分离体积差别较小的颗粒，需制备密度梯度离心介质，介质最大密度应小于被分离生物颗粒的最小密度。等密度离心法：分离密度不等的颗粒，颗粒密度等于介质密度时悬浮于介质中不移动。" },
          { front: "流式细胞技术", back: "对单个细胞进行快速定量分析与分选的技术。流式细胞仪主要由液流系统、光学系统、电子系统和分析系统四部分组成。" },
          { front: "原代培养、细胞系、细胞株", back: "原代培养：从生物供体分离取得组织或细胞后在体外进行的首次培养。原代培养细胞成功传代后成为细胞系。具有某些特征与标志的细胞群继续培养下去为细胞株。" },
          { front: "细胞融合", back: "在自发或人工诱导下，两个不同基因型的细胞或原生质体融合形成一个杂种细胞。" },
        ],
      },
      {
        name: "细胞概述",
        cards: [
          { front: "比较真核细胞与原核细胞的异同", back: "原核细胞：细胞壁主要成分肽聚糖；只有核糖体（间体是细胞膜特化结构）；核糖体70S（50S+30S）；单个环状DNA、无组蛋白；无核仁无核膜（拟核）；内膜系统简单；无细胞骨架；转录和翻译同时同地进行；无丝分裂；较小（1-10μm）。真核细胞：细胞壁主要成分纤维素（植物细胞）；有各种细胞器；核糖体80S（60S+40S）；若干双链DNA+组蛋白；有核膜有核仁；内膜系统复杂；有细胞骨架；转录在细胞核内、翻译在细胞质内；有丝分裂、减数分裂；较大（10-100μm）。两者均有细胞膜。" },
          { front: "细胞对生命体的重要意义", back: "（1）细胞是生物的基本结构单位；（2）细胞是生物的基本功能单位；（3）细胞是有机体生长发育的基本单位；（4）细胞是生物体的完整遗传单位。" },
          { front: "细胞的共同属性", back: "（1）都以DNA储存遗传信息；（2）通过依照模板的聚合作用复制遗传信息；（3）都将部分遗传信息转录成RNA；（4）所有细胞都用蛋白质作催化剂；（5）RNA翻译成蛋白质的方式相同，核糖体存在于一切细胞内；（6）生命需要自由能；（7）细胞表面均有细胞膜；（8）增殖都以一分为二的方式进行分裂。" },
          { front: "最小最简单的细胞", back: "支原体是最小、最简单的细胞。" },
          { front: "光镜与电镜下细胞结构的划分", back: "光镜下细胞分为细胞膜、细胞质和细胞核三部分。电镜下细胞结构分为膜相结构和非膜相结构两大类。" },
          { front: "细胞内的三大系统", back: "生物膜系统、细胞骨架系统、遗传基因表达系统。" },
          { front: "水的功能", back: "细胞生化反应的良好溶剂；调节并维持细胞内外的酸碱平衡；参与物质运输；维持体温在正常水平。" },
          { front: "无机盐的功能", back: "维持细胞内渗透压与酸碱平衡；作为酶的辅助因子；作为第二信使调节代谢；参与细胞结构的构成；维持细胞内外电位差，保持可兴奋性。" },
          { front: "核苷酸之间的连接方式", back: "一个核苷酸残基上的3’羟基和另一个核苷酸的5’磷酸基之间形成磷酸二酯键，核苷酸与核苷酸之间通过磷酸二酯键连接形成多核苷酸链。" },
          { front: "DNA双链的结构", back: "DNA由两条反向平行的多核苷酸链构成，两条链通过碱基之间形成氢键而互补配对，脱氧核糖和磷酸交替连接构成基本骨架。" },
          { front: "生物大分子", back: "又称多聚体，是指由许多小分子聚合而成的、具有生物活性的、分子量可达到上万或更多的有机分子。常见的包括蛋白质、核酸、糖类、脂类，是细胞内的主要化学成分。" },
          { front: "DNA分子双螺旋结构模型", back: "由两条平行而且方向相反的、遵循碱基互补配对原则的核苷酸链以右手螺旋盘旋成双螺旋结构。主要特点：DNA分子的碱基均位于双链的内侧，通过氢键相连，且遵循碱基互补配对原则。" },
          { front: "蛋白质二级结构", back: "在一级结构的基础上，通过氢键在氨基酸残基之间的对应点连接，使蛋白质结构发生曲折的结构。有三种类型：α螺旋结构（肽链以右手螺旋盘绕成空心的筒状构象）；β折叠片层（一条肽链回折而成的平行排列构象）；三股螺旋（胶原的特有构象，由原胶原的三条多肽链共同铰接而成）。" },
        ],
      },
      {
        name: "细胞膜",
        cards: [
          { front: "细胞膜", hot: true, back: "包围在细胞质表面的一层薄膜，由脂双层构成基本结构，又称质膜。" },
          { front: "单位膜", back: "细胞膜性结构在电镜下呈现出较为一致的3层结构，即电子致密度高的内外两层之间夹着电子致密度较低的中间层，称为单位膜。" },
          { front: "膜脂的组成", back: "膜脂主要包括磷脂、胆固醇和糖脂三类，都是双亲性分子（兼性分子），有亲水头部和疏水尾部。" },
          { front: "磷脂的分类", back: "主要有甘油磷脂和鞘磷脂两大类。甘油磷脂以甘油为骨架，疏水尾部为两条脂肪酸链（一条饱和、一条不饱和），包括磷脂酰胆碱（卵磷脂）、磷脂酰丝氨酸、磷脂酰乙醇胺（脑磷脂）、磷脂酰肌醇；鞘磷脂以鞘胺醇为骨架，在脑和神经细胞膜中特别丰富。" },
          { front: "胆固醇的作用", back: "调节（一般为降低）膜的流动性和加强膜的稳定性。" },
          { front: "膜蛋白的分类及作用", back: "分为膜内在蛋白、膜外周蛋白和脂锚定蛋白三类。起机械支持、物质运输、细胞外信号受体、黏附和酶等作用。" },
          { front: "膜内在蛋白", back: "又称整合蛋白、镶嵌蛋白或跨膜蛋白，跨膜结构域为1至多个疏水的α螺旋，也有β折叠片层构象。" },
          { front: "膜外周蛋白", back: "又称周围蛋白质，不直接与脂双层的疏水尾部相连，一般通过非共价键与跨膜蛋白亲水区或脂类极性区相互作用，主要分布在膜的内表面。" },
          { front: "脂锚定蛋白", back: "以共价键与脂分子结合，分布在膜两侧。" },
          { front: "糖萼", back: "糖蛋白和糖脂的糖分子侧链在细胞表面形成的细胞包被，称为糖萼。" },
          { front: "细胞膜的分子结构模型", back: "流动镶嵌模型、片层结构模型、单位膜模型、脂筏模型。" },
          { front: "细胞膜的主要特性", back: "膜的流动性和不对称性。" },
          { front: "膜脂流动性的运动方式", back: "烃基链的旋转异构、脂肪酸链的伸缩振荡、翻转、侧向扩散、旋转。" },
          { front: "影响膜脂流动性的因素", back: "脂肪酸链的饱和度和长度、胆固醇、卵磷脂和鞘磷脂的比值、膜蛋白的影响、温度、酸碱度、离子强度等。" },
          { front: "膜流动性的生理意义", back: "物质运输；信号转导；细胞周期；细胞识别、免疫；细胞生长、衰老。" },
          { front: "液态镶嵌模型", hot: true, back: "细胞膜由流动的脂双层和镶嵌在其中的蛋白质构成，具有液晶态特性。磷脂分子以疏水尾部相对、极性头部朝向水相组成膜骨架；蛋白质或镶嵌在脂双层表面、或镶嵌其中、或横跨脂双层，体现分布的不对称性；糖类附在膜外表面。该模型强调了膜的流动性和不对称性，忽略了膜蛋白对脂双层的控制作用和膜各部分流动性的不均一性。" },
          { front: "被动运输", back: "物质顺浓度梯度从高浓度一侧运输到低浓度一侧的过程，不需要消耗细胞代谢的能量，所需能量来自高浓度本身所含的势能。分为简单扩散、离子通道扩散、易化扩散（帮助扩散）。" },
          { front: "主动运输", hot: true, back: "物质逆浓度梯度（或电化学梯度）、从低浓度一侧向高浓度一侧跨膜转运的过程，需要载体蛋白的协助和消耗细胞代谢能量。分为离子泵和伴随运输（协同运输）。" },
          { front: "简单扩散", back: "又称自由扩散：分子由高浓度一侧向低浓度一侧自由运动。不消耗细胞代谢能量，不依靠专一性膜蛋白分子，只要膜两侧保持一定的浓度差即可发生。（如脂溶性物质、气体物质、水）" },
          { front: "易化扩散", back: "又称帮助扩散或协助扩散：一些非脂溶性（亲水性）物质如氨基酸、糖、核苷酸、金属离子等，凭借膜上载体蛋白的帮助进出细胞膜，不消耗细胞代谢能，顺浓度梯度转运。" },
          { front: "载体蛋白与通道蛋白的区别", back: "载体蛋白与特定溶质结合，改变自身构象使溶质跨膜；通道蛋白形成水溶性通道，贯穿脂双层，特定离子可经通道跨膜。" },
          { front: "通道扩散", back: "一些极性很强的离子如Na+、K+、Ca2+等通过膜上的离子通道进行高效率转运的方式。分为电压门控通道、机械门控通道、配体门控通道。" },
          { front: "配体闸门通道与电压闸门通道", back: "配体闸门通道：仅在细胞外的配体与细胞表面结合、引起通道蛋白构象改变时才开放；电压闸门通道：仅在膜电位发生变化时才开放。" },
          { front: "离子泵运输", back: "ATP直接提供能量的主动运输。如钠钾泵：钠出钾入。" },
          { front: "耦联运输（协同运输）", back: "ATP间接提供能量的主动运输：一种物质以被动运输的方式进行，产生的势能推动另一种物质进行主动运输。分为同向运输和对向运输，例如小肠上皮细胞吸收葡萄糖。" },
          { front: "伴随运输（co-transport）", back: "有些物质逆浓度主动运输的动力不是直接来自ATP水解，而是由离子浓度梯度中储存的能量来驱动，这种由Na+等离子驱动的主动运输过程称为伴随运输。" },
          { front: "Na-K泵（钠钾泵）", hot: true, back: "镶嵌在质膜脂双层中的一种蛋白质，即Na+-K+-ATP酶，具有载体和酶的活性。由α、β两个亚单位组成：大的α亚单位为催化部分，其细胞质端有ATP和Na+的结合位点，外端有K+和乌本苷的结合位点，通过反复磷酸化和去磷酸化进行活动。该酶在Na+、K+、Mg2+同时存在时才能被激活，催化水解ATP，为Na+、K+的对向运输提供能量。" },
          { front: "Na+-K+泵的工作原理及其意义", hot: true, back: "钠钾泵实质是Na+-K+-ATP酶，是膜中的内在蛋白，将细胞内Na+泵出、同时将细胞外K+泵入。通过磷酸化和去磷酸化引起构象变化：膜内侧Na+与酶结合，激活ATP酶活性使ATP分解，酶被磷酸化，构象变化使结合Na+的部位转向膜外侧；磷酸化的酶对Na+亲和力低、对K+亲和力高，故在膜外侧释放Na+并结合K+；K+促使酶去磷酸化，构象恢复，结合K+的部位转向膜内侧，K+被释放。每一循环消耗一个ATP，泵出3个Na+，泵入2个K+。意义：维持细胞渗透压、保持细胞体积和正常生理形态；维持低Na+高K+的细胞内环境，尤其维持神经细胞静息电位。" },
          { front: "胞吞作用", back: "细胞表面发生内陷，由细胞膜将环境中的大分子和颗粒物质包围成小泡，脱离细胞膜进入细胞内的转运过程。（包括吞噬作用、胞饮作用、受体介导的内吞作用）" },
          { front: "胞饮作用", back: "通过小囊泡（约150nm）吞饮液体和小颗粒物质。" },
          { front: "吞噬作用", back: "通过大囊泡（约250nm）吞吃大颗粒物质。" },
          { front: "受体介导的胞吞作用", hot: true, back: "特异性很强的胞吞作用：大分子先与细胞膜上的特异性受体识别并结合，通过膜囊泡系统完成物质运输。小囊泡表面覆盖毛刺状衣被，称衣被小泡或有被小泡，因此又称有被小泡运输。运输速度大于液相胞饮，能使细胞摄入大量特定分子而不带入过多胞外液体，具有选择性浓缩作用。" },
          { front: "以LDL为例简述受体介导的胞吞作用", hot: true, back: "LDL颗粒悬浮于血中，当细胞需要胆固醇时即合成跨膜受体蛋白并插入质膜；LDL颗粒外层蛋白与质膜上有被小窝的LDL受体特异结合，诱导未结合的受体移来结合，使有被小窝不断向胞质凹陷，LDL颗粒与受体一起进入细胞形成有被小泡；小泡迅速脱衣变成无被小泡，与晚期内体融合；晚期内体膜上H+-ATP酶将H+泵入，pH降至5-6，酸性条件下受体与LDL解离并分隔到两个小囊泡：包裹受体的返回细胞膜循环利用，包裹LDL的被溶酶体分解，释放游离胆固醇进入细胞质，成为细胞合成膜的原料。" },
          { front: "膜泡运输", back: "大分子物质、颗粒物质被小囊泡包裹进出细胞膜和内膜细胞器之间运输的方式。分为吞噬作用、胞饮作用、受体介导的胞吞作用、陷穴蛋白介导的胞饮作用。" },
          { front: "胞吐作用", back: "又称外排作用：细胞内某些物质由膜包围成小泡，从细胞内部逐步移到质膜下方，小泡膜与质膜融合，把物质排到细胞外的运输过程。" },
          { front: "胞吐作用的两种分泌形式", back: "结构性分泌途径：新合成的分子在高尔基复合体装入囊泡后随即分泌出细胞；调节性分泌途径：新合成的分子储存在特殊囊泡内，细胞受到外界信号刺激时才分泌。" },
          { front: "比较胞饮作用与吞噬作用的异同", back: "异：胞饮吞入大分子溶液物质或极微小颗粒（形成胞饮体或胞饮小泡）；吞噬吞入较大的固体颗粒或分子复合物（形成吞噬体或吞噬泡）。同：都包含吸附和吞进两个相对独立的过程；过程都是物质吸附→膜内陷→膜分离→膜融合。" },
          { front: "比较主动运输与被动运输", back: "主动运输：逆浓度梯度或电化学梯度跨膜转运（离子泵和伴随运输），需载体蛋白协助并分解ATP供能，为细胞提供所需物质并维持正常渗透压。被动运输：顺浓度梯度转运（单纯扩散、易化扩散、离子通道扩散），动力来自浓度梯度，不需细胞代谢能量，为无需耗能跨膜的物质提供快速通道。" },
          { front: "生物膜的基本特征及其与功能的关系", back: "两个显著特征：不对称性（膜蛋白、膜脂分布的不对称）和流动性（膜脂运动：烃链旋转异构、脂肪酸链伸缩振荡、旋转、侧向扩散、翻转；膜蛋白运动：侧向扩散、旋转扩散）。不对称性使膜的两层流动性不同，有助于维持膜蛋白极性，保证膜功能的方向性，使膜两侧具有不同功能。一切膜的基本活动均在膜的流动状态下进行；若膜固化、黏度增大到一定程度，物质传送中断、膜内酶活性中止，最终导致细胞死亡。" },
          { front: "细胞表面", back: "细胞膜、细胞外被、细胞膜内面的胞质溶胶、各种细胞连接结构和细胞膜的一些特化结构统称为细胞表面。" },
          { front: "双亲媒性分子", back: "由一个亲水的极性头部和一个疏水的非极性尾部组成的分子，如磷脂。构成膜的脂类有磷脂、胆固醇和糖脂，其中以磷脂为最多，三者都是双亲媒性分子。" },
          { front: "脂质体", back: "为减少双分子层两端疏水尾部与水接触的机会，脂质分子在水中排列成双分子层后形成的一种自我封闭的双层球型结构。" },
          { front: "与膜整合蛋白形成有关的序列及其作用", back: "起始转移序列（包括ER信号肽、内信号肽）：引导蛋白质开始穿膜；终止转移序列：终止穿膜转移。起始转移序列成为单次跨膜α螺旋；内信号肽也成为单次跨膜α螺旋。" },
          { front: "细胞表面及特化结构", back: "包括细胞外被、鞭毛和纤毛、微绒毛、细胞的变形足和皱褶等。" },
          { front: "膜流", back: "由于膜泡运输，真核细胞生物膜在各个膜性细胞器及质膜之间的常态性转移。" },
          { front: "比较结构性分泌和调节性分泌", back: "结构性分泌途径：分泌蛋白合成后立即被包装进高尔基体的分泌囊泡，随即很快运到质膜处分泌到细胞外，普遍存在于所有细胞。调节性分泌途径：分泌蛋白合成后储存于分泌囊中，只有接受细胞外信号（如激素）刺激、引起胞内Ca2+浓度瞬时升高时才启动胞吐，只存在于特化的分泌细胞（分泌激素、神经递质、消化酶的细胞）。两者均属胞吐作用，是细胞将分泌产生的激素、酶类及未被消化的残渣等运出细胞的重要方式。" },
        ],
      },
      {
        name: "细胞连接与细胞外基质",
        cards: [
          { front: "细胞连接", hot: true, back: "相邻细胞膜接触区域特化形成的连接结构。作用是加强细胞间的机械联系、维持组织结构的完整性、协调细胞间的功能活动。分为封闭连接（闭锁连接）、锚定连接和通讯连接。" },
          { front: "紧密连接（封闭连接）", back: "见于体内管腔及腺体上皮细胞顶端，呈带状环绕细胞，连接区域呈“焊接线”样带状网络，相邻质膜紧密结合。作用：将上皮细胞紧密连合；封闭相邻细胞间隙，保证机体内环境的稳定性；构成上皮细胞膜脂和膜蛋白侧向扩散的屏障，维持上皮细胞极性。" },
          { front: "锚定连接", back: "由细胞骨架参与、存在于细胞间或细胞与细胞外基质之间的细胞连接，分布在上皮、心肌和子宫颈等需承受机械力的组织。由细胞内锚定蛋白和跨膜黏着蛋白构成：细胞骨架—细胞内锚定蛋白—跨膜黏着蛋白—相邻细胞跨膜黏着蛋白/细胞外基质。" },
          { front: "锚定连接的分类（桥粒与半桥粒）", hot: true, back: "按细胞骨架类型分两类：①肌动蛋白参与的黏着连接——黏着带（细胞间，E-钙黏着蛋白）、黏着斑（细胞与胞外基质，整联蛋白α5β1）；②中间纤维参与的桥粒连接——桥粒（细胞间，桥粒黏蛋白、桥粒胶蛋白）、半桥粒（细胞与基底膜，整联蛋白α6β4）。桥粒与半桥粒的区别在于连接对象：桥粒是细胞与细胞间，半桥粒是细胞与基底膜间。" },
          { front: "间隙连接（缝隙连接）", back: "主要功能是介导细胞与细胞间的通讯，表现为代谢耦联和电耦联。基本结构单位是连接子，每个连接子由6个连接蛋白组成。" },
          { front: "细胞粘附分子", hot: true, back: "通过三种方式介导细胞识别和粘附：同亲型结合、异亲型结合、连接分子依赖性结合。" },
          { front: "细胞粘附分子的分类", back: "钙黏蛋白（同亲型结合，Ca2+依赖，成员E、N、P-钙黏蛋白、桥粒-钙黏蛋白）、选择素（异亲型结合，Ca2+依赖，如P-选择素）、免疫球蛋白超家族（Ca2+非依赖，如N-CAM）、整联蛋白（异亲型结合，Ca2+、Mg2+依赖，如α1β2、α6β4）。" },
          { front: "钙黏蛋白的功能", back: "（1）介导细胞之间的同亲型细胞黏附；（2）影响细胞分化，参与组织器官形成；（3）参与细胞之间稳定的特化连接结构（锚定连接）。" },
          { front: "选择素的功能", back: "主要参与白细胞或血小板与血管内皮细胞之间的识别与黏附，帮助白细胞从血液进入炎症部位。" },
          { front: "免疫球蛋白超家族的功能", back: "对神经系统的发育、轴突的生长和突触的形成有重要作用。" },
          { front: "整联蛋白的功能", back: "介导细胞与细胞外基质间的黏着；介导细胞之间的相互作用；参与细胞与环境间的信号转导。" },
          { front: "细胞外被（糖萼）", hot: true, back: "细胞膜上的糖蛋白和糖脂上所有糖类都位于膜的外表面，大多数真核细胞膜表面富糖类的周缘区称为细胞外被或糖萼。其寡糖和多糖能吸附水分形成黏性表面，保护细胞表面免受机械和化学损伤，并在细胞间识别和黏附方面有重要作用。" },
          { front: "细胞外基质（ECM）", hot: true, back: "机体发育过程中由细胞合成并分泌到细胞外的生物大分子构成的纤维网状物质，分布于细胞与组织之间、细胞周围或形成上皮细胞的基膜，将细胞与细胞或细胞与基膜相联系，构成组织与器官，使其连成有机整体。主要组分为氨基聚糖与蛋白聚糖、胶原与弹性蛋白、非胶原糖蛋白三大类。" },
          { front: "氨基聚糖（GAG）", back: "由氨基己糖和糖醛酸（硫酸角质素中是半乳糖）二糖结构单位重复排列、聚合形成的无分支长链多糖，包括透明质酸、硫酸软骨素、硫酸皮肤素、硫酸乙酰肝素、肝素和硫酸角质素6种。能维持组织结构和功能的完整性、防止细胞过早分化、参与蛋白聚糖构成；其中透明质酸是唯一不硫酸化的氨基聚糖。" },
          { front: "蛋白聚糖", back: "核心蛋白与硫酸氨基聚糖的共价结合物，具有空间填充和机械性能，赋予软骨良好的弹性和抗压性，参与构成基膜。" },
          { front: "胶原蛋白与弹性蛋白", back: "胶原蛋白是细胞外基质的骨架；弹性蛋白赋予组织一定的弹性，又限制其伸展程度，防止组织撕裂。" },
          { front: "纤连蛋白", back: "调节细胞黏附和细胞行为，为胚胎发育中细胞迁移和运动提供底质，参与凝血、伤口修复、细胞吞噬过程。" },
          { front: "层粘连蛋白", back: "基膜的主要功能成分，在早期胚胎中对保持细胞间黏附、细胞极性、细胞分化有重要作用。" },
          { front: "基膜", hot: true, back: "上皮组织与结缔组织之间的特化细胞外基质，由Ⅳ型胶原、层粘连蛋白及硫酸乙酰肝素蛋白聚糖等构成的网状结构。在上皮组织和结缔组织之间起结构连接作用，对大分子和细胞的移动起选择性屏障作用，对组织再生和创伤愈合也有重要作用。" },
          { front: "细胞外基质的生物学作用", back: "（1）影响细胞的存活、死亡；（2）决定细胞的形状；（3）调节细胞的增殖；（4）控制细胞的分化；（5）参与细胞的迁移。" },
          { front: "锚定依赖性", back: "正常真核细胞（成熟血细胞除外）大多须黏附于特定的细胞外基质上才能抑制凋亡而存活，称为锚定依赖性。" },
          { front: "与细胞连接相关的骨架成分", back: "微丝：形成锚定连接（黏合带和黏合斑）；中间纤维：形成桥粒和半桥粒。" },
        ],
      },
      {
        name: "内膜系统",
        cards: [
          { front: "内膜系统", hot: true, back: "相对质膜而言，细胞内那些在结构、功能及发生上相互关联的所有膜性结构细胞器统一称为内膜系统。主要包括内质网、高尔基复合体、溶酶体、过氧化物酶体（内体）、各种转运小泡及核膜结构，不包括线粒体和叶绿体。" },
          { front: "内质网的结构", back: "一种封闭的扁平囊状、管状、泡状结构，外表面称细胞质基质面，内表面称腔面。扁平囊、小管、小泡是内质网的“单位结构”。内质网对细胞的生理变化敏感，如饥饿、缺氧、辐射、胆碱缺乏、肝炎、激素或药物等影响均可使内质网囊泡化。" },
          { front: "微粒体", back: "细胞离心后得到的直径为100nm的球形封闭小泡结构，是破碎的内质网。" },
          { front: "内质网的标志酶", back: "葡萄糖-6-磷酸酶。" },
          { front: "粗面内质网的功能", back: "参与蛋白质的合成、修饰、折叠与装配、转运。" },
          { front: "信号假说（信号肽假说）", hot: true, back: "指导分泌性蛋白质多肽链在粗面内质网上合成的决定性因素是合成肽链N端的一段特殊核苷酸序列即信号肽；核糖体与内质网的结合以及肽链穿越内质网膜的转移，是在细胞质基质中信号识别颗粒（SRP）的介导、内质网膜上SRP受体以及称为移位子的通道蛋白的协助下实现的。" },
          { front: "信号肽假说的过程", hot: true, back: "①游离核糖体上合成信号肽；②胞质基质中SRP识别信号肽，形成SRP—核糖体复合体，翻译暂停；③核糖体与粗面内质网结合，形成SRP—SRP受体—核糖体复合体；④SRP脱离核糖体再参加循环，多肽链继续合成并向内质网腔转运；⑤信号肽被信号肽酶切除并在内质网腔降解；⑥蛋白质合成结束，附着核糖体脱离内质网，大小亚基分离，参与核糖体再循环。" },
          { front: "协同翻译转移", back: "翻译中的多肽链随着翻译同时进入内质网腔内，这种转移方式称为协同翻译转移。" },
          { front: "信号肽的特点", back: "（1）一般带有10~15个疏水氨基酸；（2）靠近N端常有1个或数个带正电荷的氨基酸；（3）C末端靠近蛋白酶切割位点处常带数个极性氨基酸，离切割位点最近的那个氨基酸带有很短的侧链。" },
          { front: "信号肽（signal peptide）", back: "存在于多肽链上的一段连续的氨基酸序列，可引导核糖体附着于RER（粗面内质网）表面。" },
          { front: "信号斑", back: "存在于完成折叠的蛋白质中，构成信号斑的信号序列之间可以不相邻，折叠在一起构成蛋白质分选的信号。" },
          { front: "糖基化（N-连接糖基化）", hot: true, back: "N-连接寡糖（14个糖残基）与内质网膜的多萜醇连接后被活化，当合成中的肽链中天冬酰胺一出现在腔内面，活化的寡糖就在糖基转移酶的催化下转移到Asn残基上。蛋白质的糖基化：在糖基转移酶催化下，单糖或寡聚糖与蛋白质的氨基酸残基共价连接形成糖蛋白的过程。" },
          { front: "分子伴侣", back: "一类能够协助其它多肽进行正常折叠、组装、转运、降解的蛋白，在DNA复制、转录、细胞骨架功能、细胞内信号转导等领域发挥重要生理作用。其C端末尾具有滞留信号肽KDEL，可与内质网膜上的KDEL受体结合，使之驻留在内质网腔面不被转运，故属驻留蛋白。主要包括：蛋白二硫键异构酶（PDI，切断错误结合的二硫键帮助正确折叠）、结合蛋白（Bip，与未折叠蛋白的疏水氨基酸结合防止错误折叠和聚合）、葡萄糖调节蛋白94（Grp94，参与新生肽链的折叠与转运）。" },
          { front: "粗面内质网中蛋白质的运输", back: "（1）以运输囊泡形式进入高尔基复合体，修饰加工后再输出细胞外；（2）形成浓缩泡，通过胞吐排出。" },
          { front: "跨膜蛋白的形成", back: "①停止转移信号与单次跨膜蛋白的形成：停止转移信号成为单次跨膜α螺旋；②内信号肽与单次跨膜蛋白的形成：内信号肽成为单次跨膜α螺旋。" },
          { front: "滑面内质网的功能", back: "（1）参与脂质的合成与转运；（2）参与解毒作用；（3）参与糖原代谢；（4）肌细胞中Ca2+的储存场所；（5）与胃酸、胆汁的合成与分泌密切相关。" },
          { front: "高尔基复合体的结构", back: "由扁平囊泡、小囊泡（运输小泡）和大囊泡（分泌泡）三种基本成分组成的高度有极性的细胞器。膜含约60%蛋白质和40%脂类，厚6~7nm。标志酶是糖基转移酶。凸出的一面对着内质网称为形成面（顺面膜囊），凹进的一面对着质膜称为成熟面（反面膜囊）。" },
          { front: "高尔基复合体的功能", back: "（1）参与蛋白质加工：糖基化、水解活化；（2）参与糖类和脂类的合成和修饰；（3）参与细胞分泌活动；（4）进行膜的转化（膜流：内膜系统中各细胞器膜性成分相互联系和转化的现象）；（5）参与形成溶酶体。" },
          { front: "高尔基复合体行使功能的形态结构", back: "①顺面膜囊接受内质网新合成的物质，分类后转入中间膜囊，小部分返回（驻留蛋白）；②中间膜囊含NADP酶和焦磷酸硫胺素酶等，负责对蛋白质、脂类等进行加工修饰；③反面膜囊含唾液酸转移酶、半乳糖转移酶等，参与蛋白质的再次分选和包装，并将其输出。" },
          { front: "溶酶体", back: "一层单位膜构成的囊泡状细胞器，内含多种酸性水解酶类。" },
          { front: "溶酶体的M6P途径", back: "溶酶体的酶类在内质网合成后跨膜进入内质网腔，在顺面高尔基体带上甘露糖-6-磷酸（M6P）标志；高尔基反面膜囊上存在M6P受体并与之结合，通过该受体将溶酶体酶包被，再脱磷酸化成为溶酶体。" },
          { front: "溶酶体的分类", back: "按功能阶段分为初级溶酶体、次级溶酶体和三级溶酶体；按形成过程不同分为内体性溶酶体和吞噬性溶酶体。" },
          { front: "初级溶酶体", back: "只含酸性水解酶而不含被消化物质（底物）、尚未进行消化活动的溶酶体。" },
          { front: "次级溶酶体", back: "初级溶酶体和细胞内的自噬体或异噬体融合形成的复合体，包括自噬溶酶体和异噬溶酶体。" },
          { front: "三级溶酶体（残留小体）", back: "次级溶酶体完成绝大部分消化分解后，残留一些不能被消化分解的物质，酶活性逐渐降低至消失，进入终末状态，称为三级溶酶体，又称残留小体。包括脂褐素、髓样结构、含铁小体。" },
          { front: "溶酶体的酸性环境", back: "溶酶体中的酶均属酸性水解酶，最适pH约为5。溶酶体膜有质子泵，将H+泵入形成和维持酸性环境；膜蛋白高度糖基化，防止自身膜蛋白被降解。" },
          { front: "溶酶体的功能", back: "（1）清除无用的大分子物质、衰老的细胞器及衰老损伤或死亡的细胞；（2）机体防御保护功能的组成部分；（3）消化物质和提供营养；（4）调节腺体组织和细胞的分泌；（5）协助器官组织的变态和退化；（6）协助精子和卵细胞受精。" },
          { front: "与溶酶体有关的疾病", back: "Ⅱ型糖原积累病、黏多糖沉积病、矽肺、痛风、类风湿性关节炎等。先天性溶酶体病是由于溶酶体中酶相关基因缺陷。" },
          { front: "过氧化物酶体", back: "又称微体，标志酶是过氧化氢酶，主要的酶是氧化酶，还有过氧化物酶类。功能：调节细胞的氧张力；解毒作用；对脂肪进行β-氧化、再生氧化型辅酶Ⅰ（NAD+）以及参与核酸和糖代谢。" },
          { front: "内体", back: "细胞内一类异质性的膜泡，由细胞胞吞作用形成，有早期内体和晚期内体之分。" },
          { front: "内膜系统各细胞器的特征酶", back: "内质网：葡萄糖-6-磷酸酶；高尔基复合体：糖基转移酶；溶酶体：酸性磷酸酶；过氧化物酶体：过氧化氢酶。" },
          { front: "内膜系统的形成对细胞生命活动的意义", back: "①各细胞器膜结构的合成和装配统一进行，提高合成效率，保证膜结构及膜蛋白方向的一致性；②在细胞内形成特定功能区域和微环境（酶系统的隔离与衔接、pH差异、离子浓度维持、扩散屏障和膜电位建立）；③通过小泡分泌完成膜的流动和特定功能蛋白的定向运输，保证膜结构更新及杀伤性酶类运输的安全；④许多酶反应在膜上进行，使各种酶反应互不干扰；⑤扩大表面积，提高表面积与体积之比；⑥区室形成，相对提高重要分子浓度，提高反应效率。" },
          { front: "细胞运输蛋白质的“路线图”", back: "游离核糖体合成的蛋白质去向：①细胞核（门控运输）；②线粒体（穿膜运输）；③过氧化物酶体（穿膜运输）；④留在细胞基质（违约或欠缺途径）。带起始转移序列的核糖体穿膜附着至内质网→运输小泡包裹→高尔基复合体（膜泡运输）→①溶酶体；②膜整合蛋白；③分泌蛋白；④返回内质网。" },
          { front: "以信号肽引导蛋白质进入内质网为例说明蛋白质运输分选机制", back: "核糖体合成信号肽→被胞质中SRP识别并结合→蛋白质合成暂停→SRP识别内质网上的SRP受体并与之结合→核糖体锚泊附着于内质网通道蛋白移位子上→SRP脱离参加再循环→蛋白质继续合成→合成中的肽链通过核糖体大亚基中央管和移位子蛋白共同形成的通道进入内质网腔→信号肽被内质网内表面的信号肽酶切去→核糖体在分离因子作用下脱离内质网。" },
        ],
      },
      {
        name: "线粒体",
        cards: [
          { front: "线粒体的地位", back: "除细胞核以外唯一含有DNA的细胞器。" },
          { front: "线粒体膜的组成特点", back: "外膜厚5.5~7nm，通透性非常高，允许分子量5kD以下的分子自由通过；内膜厚4~5nm，含大量心磷脂，通透性很低。" },
          { front: "线粒体的超微结构", back: "主要包括外膜、内膜、膜间腔和基质。" },
          { front: "基粒", back: "电镜下线粒体内膜和嵴的基质面上附有许多带柄球状颗粒，称为基粒。由多种蛋白质亚基组成，分头部、柄部和基片三部分，本质是ATP合酶复合体（ATP酶复合体）：头部具有酶活性，能催化ADP磷酸化生成ATP。" },
          { front: "细胞呼吸", back: "在活细胞的线粒体内，在氧气的参与下，胞内有机物（糖、蛋白质、脂肪等）彻底氧化分解为二氧化碳和水，释放能量并生成ATP的过程。又称生物氧化或细胞氧化。" },
          { front: "糖有氧氧化的四个阶段", back: "①细胞质基质中葡萄糖分解为丙酮酸；②丙酮酸进入线粒体基质脱羧生成乙酰辅酶A；③线粒体基质中进行三羧酸循环；④线粒体内膜上进行电子传递及氧化磷酸化。" },
          { front: "一分子葡萄糖彻底氧化的ATP产量", back: "38个（新版本为32个）：糖酵解阶段2个，丙酮酸氧化阶段2个，氧化磷酸化阶段34个（新版本为28个）。" },
          { front: "线粒体的半自主性", hot: true, back: "线粒体有独立的遗传系统：①线粒体DNA为环状、裸露、信息量较小，有独立的编码系统；②可自我复制、转录；③有自己的核糖体，能独立合成线粒体蛋白质；④所用遗传密码与“通用”遗传密码不完全相同。但仅约13种线粒体蛋白质亚基由线粒体DNA编码，绝大多数线粒体蛋白质由核基因编码、在细胞质核糖体上合成后再转运入线粒体，线粒体的自我繁殖及功能活动依赖于细胞核的遗传体系，故称半自主性细胞器。" },
          { front: "线粒体各部位标志酶", back: "外膜：单胺氧化酶；膜间腔：腺苷酸激酶；内膜：细胞色素氧化酶；基质：苹果酸脱氢酶。" },
          { front: "线粒体基质（matrix）", back: "线粒体内腔充满电子密度较低的可溶性蛋白质和脂肪等成分，称之为基质。" },
          { front: "ATP合酶复合体", back: "基粒是将呼吸链电子传递过程中释放的能量用于使ADP磷酸化生成ATP的关键装置，是由多种多肽构成的复合体，其化学本质是ATP合酶复合体，也称F0F1-ATP合成酶，分为头部、柄部、基片。" },
          { front: "偶联因子F1与F0", back: "F1因子：ATP合酶复合体的头部，由5种亚基（α、β、γ、δ、ε）组成；F0因子：ATP合酶复合体的基片，至少包括a、b、c、d、e、f、g、F6、A6共9种亚基。" },
          { front: "底物水平磷酸化", back: "由高能底物水解放能，直接将高能磷酸键从底物转移到ADP（或其他核苷二磷酸）上，使其磷酸化生成ATP的作用。" },
          { front: "氧化磷酸化", hot: true, back: "供能物质的氧化过程伴随电子传递链所进行的能量转换和ATP的生成。经过糖酵解和三羧酸循环产生的NADH和FADH2所携带的电子，经线粒体内膜上的呼吸链逐级定向传递给O2，电子传递过程中释放的能量被F1F0-ATP酶复合体用来催化ADP磷酸化生成ATP。" },
          { front: "化学渗透假说", back: "ATP合成的一种机制：氧化磷酸化偶联的基本原理是电子传递中的自由能差造成H+穿膜传递，暂时转变为横跨线粒体内膜的电化学质子梯度；然后质子顺浓度梯度回流并释放能量，驱动结合在内膜上的ATP合酶催化ADP磷酸化成ATP。" },
          { front: "结合变构机制", back: "质子穿过F1因子的活性部位时可引起F1颗粒的构象变化，导致底物（ADP和Pi）同活性部位紧密结合和产物（ATP）的释放。" },
          { front: "三羧酸循环", back: "转入线粒体基质的乙酰CoA与草酰乙酸结合成柠檬酸而进入柠檬酸循环，由于柠檬酸有三个羧基，故称三羧酸循环。" },
          { front: "三羧酸循环的特点", back: "①是循环反应过程，每循环一次可将1分子乙酰CoA氧化成2分子CO2、4分子H2O和12分子ATP；②大多数反应可逆，但有几处不可逆反应，故单向进行；③中间产物不会因参与循环而被消耗，但可参与其他代谢反应而被消耗；④是糖类、脂类、蛋白质三大物质分解的最终代谢通路及相互转变的联系枢纽；⑤循环本身并不能生成大量ATP，与呼吸链联系起来才能形成完整的生物氧化产能体系。" },
          { front: "电子传递链（呼吸链）", back: "线粒体内膜上有序排列、相互关联成链状的传递电子的酶体系，能够可逆地接受和释放质子和电子，可使还原当量中的氢传递到氧生成水。" },
          { front: "真核细胞中常见的呼吸链", back: "2条：NADH氧化呼吸链（复合物Ⅰ、Ⅲ、Ⅳ、辅酶Q和细胞色素c）和琥珀酸氧化呼吸链（复合物Ⅱ、Ⅲ、Ⅳ、辅酶Q和细胞色素c）。" },
          { front: "细胞氧化的基本过程", back: "（1）糖酵解：糖在细胞质中酵解产生丙酮酸；（2）乙酰CoA生成：丙酮酸进入线粒体基质分解形成乙酰CoA；（3）三羧酸循环：乙酰CoA在线粒体基质中经三羧酸循环氧化；（4）电子传递和偶联的氧化磷酸化：传递H+、e-，形成H2O，合成ATP。" },
          { front: "比较氧化磷酸化与底物水平磷酸化", back: "①氧化磷酸化在线粒体呼吸链上进行氢和电子传递中伴随ATP生成，底物水平磷酸化与呼吸链无关；②氧化磷酸化产能多：氢和电子从NADH（FADH2）传给氧生成H2O时可生成3分子（2分子）ATP，底物水平磷酸化仅生成1分子ATP。" },
          { front: "线粒体内外膜组成差别及其意义", back: "内膜胆固醇少（外膜的1/6）、脂类总量少（外膜的1/3）、不溶性蛋白多（21种对14种）、蛋白质/脂类为4:1（外膜为1:1）。意义：内膜极低的通透性形成对分子和离子透过的严格控制，使丙酮酸、H+、ATP等不能自由通过，只能借助内膜上的载体或通透酶系统跨膜运输；内膜形成的嵴为高效率生化反应提供保障。外膜的孔蛋白是物质转运的通道，是其较高通透性的基础。" },
          { front: "ATP的生成与线粒体哪个结构有关", back: "由线粒体ATP合成酶（F1F0-ATP酶）生成，该酶是从线粒体嵴及内膜上分离出的复合物。F1因子由5种亚基（α、β、γ、δ、ε）组成；F0因子至少包括9种亚基（a、b、c、d、e、f、g、F6、A6）。" },
        ],
      },
      {
        name: "细胞骨架",
        cards: [
          { front: "细胞骨架", hot: true, back: "广泛存在于真核细胞内的蛋白质纤维网络系统。狭义包括微管、微丝和中间纤维；广义还包括细胞核骨架、细胞膜骨架和细胞外基质纤维骨架结构体系。微管靠近细胞核分布，微丝靠近质膜分布，中间纤维介于两者之间。对细胞的形状、运动、细胞内物质运输、染色体分离和细胞分裂等起重要作用。" },
          { front: "微管的结构", back: "由微管蛋白组成的不分支中空小管，横断面上由13条微管蛋白二聚体组成的原纤维构成。内径14nm，外径24nm，管壁厚5nm。" },
          { front: "微管蛋白", back: "主要有α微管蛋白和β微管蛋白两种，占微管总蛋白80%~90%，常结合成异二聚体，异二聚体是组装微管的基本构件。α微管蛋白上结合的GTP通常不被水解，称不可交换位点；β微管蛋白上的GTP结合位点是可交换位点，微管蛋白组装微管时GTP水解成GDP。" },
          { front: "微管的三种存在形式", back: "单管：13根原纤维组成，细胞质中的主要存在形式，不稳定。二联管：A管13根、B管10根（与A管共用3根），形成纤毛和鞭毛杆状部分的内部结构，稳定。三联管：A管13根，B、C管各10根（分别共用3根），分布于中心粒和鞭毛、纤毛的基体，稳定。" },
          { front: "微管结合蛋白（MAP）", back: "不是构成微管的基本构件，而是在微管蛋白组装成微管后结合在微管表面。有两个功能区域：碱性结合区（结合到微管表面的区域）和酸性区域（以横桥方式从微管表面突出，连接其他骨架纤维）。" },
          { front: "微管的组装过程", back: "三个时期：成核期（α和β微管蛋白聚合成核心，异二聚体在两端和侧面增加使片带状加宽到13根原纤维时合拢成一段微管）、聚合期（聚合速度大于解聚速度，微管延长）、稳定期（组装与去组装速度相等，长度相对恒定）。" },
          { front: "微管组织中心（MTOC）", back: "细胞质中微管组装的起点和核心，包括中心体、基体和着丝点。控制着微管发生的数量、位置和方向，帮助组装过程中的成核，对微管极性确定及细胞分裂中纺锤体形成起重要作用。MTOC上有γ微管蛋白环形复合体（γ-TuRC），含10~13个γ微管蛋白分子，微管蛋白异二聚体按一定方向添加其上，形成微管生长的核心。" },
          { front: "微管的极性", back: "装配快的一端称（+）端，连接β微管蛋白；装配慢的一端称（-）端，连接α微管蛋白。" },
          { front: "踏车行为", back: "微管正端发生GTP和微管蛋白的添加，同时负端具有GDP的微管蛋白发生解聚，这种装配方式称为踏车。" },
          { front: "影响微管装配的药物", back: "秋水仙碱、秋水仙胺：结合并稳定游离的微管蛋白，使之无法聚合成微管；长春花碱：结合微管蛋白异二聚体，抑制其聚合。" },
          { front: "微管的功能", back: "（1）构成细胞内网状支架，支持和维持细胞形态；（2）参与细胞内物质运输（是运输的路轨，涉及驱动蛋白和动力蛋白两类马达蛋白，均需ATP供能）；（3）参与中心粒、纤毛和鞭毛的形成；（4）维持细胞器定位和分布；（5）参与染色体运动，调节细胞分裂（形成纺锤体）；（6）参与细胞内信号传导。" },
          { front: "中心粒与纤毛/鞭毛的微管排列", back: "中心粒由9组三联体微管组成（9×3+0）；纤毛和鞭毛主体由两条中央微管和周围9组二联微管组成（9×2+2），基体部由9组三联体微管组成。" },
          { front: "微丝（MF）", back: "真核细胞内由肌动蛋白组成的直径5~7nm的骨架纤丝。肌动蛋白有两种存在形式：球状肌动蛋白单体和纤维状肌动蛋白多聚体。肌动蛋白单体中央有一裂口，内有ATP结合位点和二价阳离子（Mg2+、Ca2+）结合位点。肌动蛋白还是细肌丝的组成成分。" },
          { front: "微丝的组装", back: "三个阶段：成核期、生长期、稳定期。肌动蛋白浓度与微丝聚合速度成正比，能使微丝装配的最低肌动蛋白浓度称为临界浓度，一般负端的临界浓度高于正端。" },
          { front: "影响微丝装配的药物", back: "细胞松弛素B：与微丝结合后可切断微丝，并结合在微丝末端阻止肌动蛋白聚合；鬼笔环肽：结合聚合的微丝，抑制微丝解聚，使微丝保持稳定。" },
          { front: "微丝的功能", back: "（1）构成细胞支架并维持细胞形态（形成应力纤维、微绒毛）；（2）参与细胞运动；（3）参与细胞分裂；（4）参与细胞内物质运输；（5）参与细胞内信息传导；（6）参与肌肉收缩。" },
          { front: "中间纤维的类型", hot: true, back: "角质蛋白—上皮细胞；结蛋白—肌细胞；波形蛋白—成纤维细胞、白细胞；胶质原纤维酸性蛋白—神经胶质细胞、许旺细胞；神经丝蛋白—神经元；核纤层蛋白—核骨架；巢蛋白—脑神经干细胞。" },
          { front: "中间纤维的特点", back: "三种骨架纤维中最稳定的细胞骨架成分，直径10nm左右，介于微管和微丝之间。中间纤维结合蛋白中没有发现切割蛋白、加帽蛋白和马达蛋白等成分。" },
          { front: "中间纤维的组装", back: "①两个单体的杆状区平行排列形成双股螺旋结构的二聚体；②两个二聚体反向平行、半分子交错组装成四聚体（没有极性）；③四聚体首尾相连形成原纤维；④8条原纤维侧向相互作用，组装成中空管状的中间纤维。" },
          { front: "中间纤维的功能", back: "（1）在细胞内形成完整的网状支架系统；（2）为细胞提供机械强度支持（核的定位和固定）；（3）参与细胞的分化；（4）参与细胞内信息传递和物质运输（与mRNA运输有关，对mRNA的细胞内翻译有决定性作用）。（非纤维形式可参与胞内信号转导，影响DNA复制与转录；参与细胞连接——桥粒与半桥粒）" },
          { front: "细胞骨架各组分的功能（综合）", back: "微管：支架作用；细胞内运输（运输路轨，涉及驱动蛋白和动力蛋白，均需ATP供能）；形成纺锤体，牵引染色体；形成纤毛与鞭毛，参与细胞运动。微丝：组成细胞骨架维持形态（应力纤维、微绒毛）；参与胞质运动；构成细胞间连接装置（锚定连接）。中间纤维：支架作用（核的定位和固定）；与微丝微管一起发挥物质定向运输作用；与细胞癌变调控有关；与mRNA运输有关；参与细胞连接（桥粒与半桥粒）。" },
          { front: "微管、微丝的动力结合蛋白", back: "微丝的动力结合蛋白为肌球蛋白；微管的动力结合蛋白为动力蛋白和驱动蛋白。" },
          { front: "肌球蛋白介导细胞运动的机制", back: "肌球蛋白头部结合在微丝（肌动蛋白丝）上→水解1分子ATP→朝微丝（+）端移动2个肌球蛋白亚基的距离→产生力量引起膜泡运输、肌细胞中粗肌丝滑动。循环：①肌球蛋白结合ATP，头部与肌动蛋白纤维分离；②ATP水解，头部与肌动蛋白弱结合；③Pi释放，头部与肌动蛋白强结合；④ADP释放，进入新一轮循环。" },
          { front: "细胞运动的两种机制", back: "①需要特殊酶（主要是动力蛋白）参与：动力蛋白水解ATP获得能量，沿微丝、微管运动；②由于微管蛋白或肌动蛋白聚合、组装成束状或网络而引起细胞运动。" },
          { front: "驱动蛋白、动力蛋白、肌球蛋白", back: "驱动蛋白：微管动力蛋白，由2条重链和2条轻链聚合而成；动力蛋白（动位蛋白）：微管动力蛋白，包括胞质动力蛋白和纤毛动力蛋白；肌球蛋白：微丝的动力蛋白，由一条重链和数条轻链组成，分头部、颈部、尾部。" },
          { front: "轴突运输", back: "发生在轴突内的物质运输，目前已知是沿着微管提供的轨道进行的。" },
          { front: "顶体反应", back: "卵细胞表面覆盖胶状物，精子细胞首先伸出一个顶体突起，穿透胶质层和卵黄层，使精卵细胞膜融合而完成受精，此过程称为顶体反应。" },
        ],
      },
      {
        name: "细胞核",
        cards: [
          { front: "细胞核的组成", back: "高等动物细胞核直径一般为5~10μm，分为核被膜、染色质、核仁和核基质四部分。" },
          { front: "核膜（核被膜）的组成", back: "由外核膜、内核膜、核周间隙、核孔复合体和核纤层组成。外核膜常附有大量核糖体颗粒，有些部位与内质网相连；核周间隙（核周腔）常与内质网腔相通。" },
          { front: "核孔复合体", hot: true, back: "位于真核细胞的核膜上，由多个蛋白质颗粒以特定方式排列形成的蛋白质分子复合体；核膜上间隔分布着许多由内外两层膜局部融合形成的开口，构成复杂的盘状结构体系。是沟通细胞核与细胞质间物质交流的通道，对大分子物质的运输具有选择性。" },
          { front: "核孔复合体的结构", back: "由4部分组成：①胞质环：环上有8条细纤丝对称分布；②核质环：向核内伸入8条细纤丝，被端环连接在一起；③轮辐：分为柱状亚单位和腔内亚单位；④中央栓。整体为辐射状对称的盘状结构。" },
          { front: "核纤层", back: "内层核被膜靠近核质一侧由纤层蛋白组成的纤维状网络结构。高等动物核纤层通常由3种属于中等纤维的核纤层蛋白组成：A型主要与染色质结合；B型主要与内层核被膜上的整合蛋白结合；C型是A型核纤层蛋白同一转录产物的不同剪辑体。" },
          { front: "核纤层的功能", back: "与核被膜的稳定、维持核孔位置、稳定间期染色质形态与空间结构密切相关，还参与核膜的重建和解体。" },
          { front: "核被膜的功能", back: "保护性屏障；基因表达的时空隔离；染色质、染色体定位和酶分子支架。" },
          { front: "亲核蛋白的入核过程", back: "①具有核定位信号的亲核蛋白与入核素结合形成转运复合物；②转运复合物结合到核孔复合体上；③通过核孔复合体入核；④在核内与Ran-GTP结合；⑤亲核蛋白脱离转运复合物游离到核基质中。" },
          { front: "染色质", back: "间期细胞核内遗传物质的存在形式，由DNA、组蛋白、非组蛋白及少量RNA构成的细丝状复合结构，能被碱性染料染成深色，形状不规则，弥散分布于细胞核内。" },
          { front: "组蛋白", back: "5类：H1、H2A、H2B、H3、H4。H2A、H2B、H3、H4为核小体组蛋白，将DNA盘绕成核小体；H1不构成核小体，将核小体包装成高一级结构。组蛋白基因非常保守，亲缘关系较远的种属氨基酸序列都非常相似（H1除外）。" },
          { front: "核小体", hot: true, back: "染色质（染色体）的基本结构单位。每个核小体由200bp左右的DNA、一个组蛋白八聚体和一分子组蛋白H1组成：2个H2A-H2B二聚体和2个H3-H4二聚体组成八聚体（2个H3-H4二聚体位于核心中央，2个H2A-H2B二聚体位于两侧）；146bp的DNA在八聚体外缠绕1.75圈，H1在八聚体外结合20bp的DNA共同构成染色质小体；相邻两个核小体之间以60bp的连接DNA相连。" },
          { front: "螺线管模型", hot: true, back: "核小体构成的二级结构：核小体串珠状纤维进一步螺旋化，每圈6个核小体，形成直径30nm的螺线管。螺线管可绕中轴进一步螺旋成超螺线管。" },
          { front: "袢环模型", back: "螺线管在染色体骨架的许多位点上形成许多半径约0.6μm的袢环，一般以18个袢环呈放射状平面排列结合在骨架上，形成微带（染色体高级结构单位）。袢环的两端连接在染色体骨架上。" },
          { front: "常染色质与异染色质", back: "常染色质：折叠压缩程度低、处于伸展状态，碱性染料着色浅，由单一序列或中度重复序列DNA组成，有转录活性，是DNA复制与基因转录活跃的部位。异染色质：折叠压缩程度高、处于聚缩状态，着色深，由高度重复序列DNA组成，无转录活性，是遗传惰性区。分为结构型异染色质和兼性异染色质；兼性异染色质是在特定细胞或一定发育阶段由常染色质凝缩转变形成。" },
          { front: "染色体的主要结构", back: "（1）着丝粒和动粒：着丝粒将染色体分为短臂和长臂，着丝粒处染色质内缢为主缢痕；主缢痕处两条染色单体外侧表层的圆盘状结构为动粒，内层与着丝粒结合，外层与动粒微管结合。（2）次缢痕：主缢痕以外的其他浅染缢缩部位，该处染色质称核仁组织区。（3）随体：染色体短臂末端的球状或棒状染色质。（4）端粒：染色体末端的特化部位，有极性。" },
          { front: "着丝粒与动粒", back: "着丝粒：染色体中将两条姐妹染色单体结合起来的区域，由无编码意义的高度重复DNA序列组成，是动粒的形成部位。动粒：又称着丝点，是主缢痕外侧表层的特化圆盘状结构，由蛋白质构成，是纺锤丝的附着部位，参与分裂后期染色体向两极的迁移。" },
          { front: "核型", back: "某一个体细胞全部染色体在有丝分裂中期的表型，包括染色体的数目、大小和形态特征。" },
          { front: "核仁的化学组成", back: "蛋白质80%、RNA 10%、DNA 8%。" },
          { front: "核仁的超微结构", back: "包括纤维中心（含rDNA）、致密纤维组分（含正在转录的RNA与蛋白质的复合物）、颗粒组分（由核糖核蛋白体颗粒构成）和核仁基质（胶体状不定型物质）。" },
          { front: "核仁的功能", back: "参与合成rRNA以及装配核糖体大小亚基前体。形成的rRNA沉降系数包括28S、5.8S、18S：28S、5.8S加核仁外合成的5S rRNA与蛋白质形成大亚基；18S rRNA与蛋白质形成小亚基。核仁还可防止前体mRNA进行转译。" },
          { front: "核仁组织区（NOR）", hot: true, back: "位于染色体次缢痕处（核仁组织者区），含有rRNA基因（5S rRNA基因除外）的染色体区域，rRNA基因转录活跃，染色质凝集程度低，表现为浅染的次缢痕，与核仁形成有关。核仁组织者（nucleolus organizer）：能转录合成rRNA的DNA序列所在的部位，可组织形成核仁。" },
          { front: "核仁周期", back: "核仁在细胞周期中结构与功能周期性变化、进行周期性消失与重建的过程。细胞分裂时，rDNA浓缩成染色体，rRNA停止合成，纤维区和颗粒区消失；细胞间期，核仁组织区DNA解旋并重新转录rRNA，核仁重新装配。" },
          { front: "核基质（核骨架）", back: "广义核基质包括核基质、核纤层、核孔复合体结构体系、染色体骨架；狭义指核内基质。是真核细胞间期核中除核膜、染色质与核仁以外的部分，以非组蛋白为主构成的纤维网架结构，与核纤层、中间纤维相连形成网络体系。基本组分包括蛋白质（核基质蛋白和核基质结合蛋白）、RNA、少量DNA。" },
          { front: "核基质的功能", back: "参与DNA复制；参与基因转录和加工；参与基因表达调控；参与染色体的构建。" },
          { front: "细胞核的功能", back: "遗传信息的贮存、遗传信息的复制、遗传信息的表达。" },
          { front: "肿瘤细胞的细胞核形态改变", back: "①核质比增高；②核结构呈异型；③染色质聚集在近核膜处；④核仁体积增大。" },
          { front: "核定位信号（NLS）", back: "亲核蛋白一般都含有的、能保证整个蛋白质通过核孔复合体被运到细胞核内的特殊短肽氨基酸序列：一小段含4~8个氨基酸的短肽序列，富含带正电荷的赖氨酸和精氨酸，一般都含有脯氨酸。" },
          { front: "半不连续复制", back: "DNA复制时，一条链（前导链）连续合成，另一条链（后随链）合成不连续。" },
          { front: "复制叉", back: "复制起始时，DNA双螺旋在多种酶的作用下解开，单链结合蛋白结合于单链DNA上，使复制起始点呈叉子状，称为复制叉。" },
          { front: "冈崎片段", back: "形成后随链的不连续DNA片段，通常由一段RNA引物加一段DNA构成。" },
          { front: "后随链", back: "合成方向与复制叉推进方向相反，先形成一些短的、不连续的片段，再经DNA连接酶作用形成完整新链。" },
          { front: "基因", back: "DNA分子中含有特定遗传信息的一段核苷酸序列，是遗传物质的最小功能单位。" },
          { front: "染色体关键序列", back: "①复制源（复制起始点序列）：DNA复制的起始点；②着丝粒序列：与纺锤丝相连，确保染色体准确分离并平均分配到子细胞；③端粒序列：使DNA完整复制，保持染色体的独立性、稳定性。" },
          { front: "染色体（chromosome）", back: "细胞在有丝分裂或减数分裂过程中，染色质经复制后反复缠绕凝聚而成的条状或棒状结构，借以保证DNA被准确分配到子代细胞，对物种遗传性状稳定性的维持起重要作用。" },
        ],
      },
      {
        name: "基因信息的表达与传递",
        cards: [
          { front: "DNA复制的形式和方向", back: "半保留复制、半不连续复制；复制方向5’→3’。" },
          { front: "引发体", back: "由解旋酶、引物酶、DnaC蛋白和DNA起始复制区组成的复合体。" },
          { front: "前导链与滞后链", back: "连续合成的链为前导链；先合成冈崎片段再连接成链的不连续合成链为滞后链。" },
          { front: "DNA复制所需的酶和引物", back: "酶：异构酶、解旋酶、聚合酶、连接酶、单链DNA结合蛋白（SSB）、拓扑异构酶。引物包括RNA引物和DNA引物。" },
          { front: "基因的结构（断裂基因）", back: "包括启动子、编码区、终止子。编码区是翻译起始密码子到终止密码子的片段，包括外显子、内含子。含有不连续编码区域的基因称为断裂基因（割裂基因：真核生物细胞基因中编码序列常被非编码序列隔断，呈分裂状）。" },
          { front: "开放阅读框（ORF）", back: "在给定的阅读框架中，包含并位于起始编码与终止编码之间、不含终止密码子的一串序列，可能作为蛋白质编码序列的一部分。由于一段DNA或RNA序列有多种不同读取方式，因此可能同时存在许多不同的开放阅读框。" },
          { front: "模板链与有意义链", back: "转录过程中作为转录模板的链称为模板链；另一条与mRNA有相同序列的DNA链称为有意义链。" },
          { front: "转录的三个阶段", back: "起始：RNA聚合酶σ亚基识别启动子并结合成复合体；延长：核心酶沿模板链3’→5’移动，RNA合成方向5’→3’；终止：ρ因子不依赖终止和ρ因子依赖终止两种方式。RNA聚合酶全酶由5个亚基组成（ααββ’σ），不含σ亚基的部分叫核心酶。" },
          { front: "真核生物mRNA前体的加工", back: "真核生物mRNA前体称核内不均一RNA（hnRNA），其5’端加7-甲基鸟苷酸“帽子”，3’端加poly A“尾巴”。hnRNA经戴帽、加尾及剪接等加工过程形成成熟mRNA。" },
          { front: "基因中的转录调节序列", back: "增强子、沉默子、反应元件。" },
          { front: "遗传密码的特性", back: "简并性：一种以上密码子编码同一个氨基酸；方向性：翻译沿mRNA 5’→3’方向进行；连续性：遗传密码间无间断、无交叉；通用性：绝大多数生物共用一套密码子。终止密码UGA、UAA、UAG不代表任何氨基酸，是多肽链合成的终止信号。" },
          { front: "中心法则", hot: true, back: "遗传信息从DNA经转录传递给RNA，再由RNA经翻译传递给蛋白质，以及DNA的自我复制，这一信息流动规律称为中心法则。" },
          { front: "核糖体的三个位点", back: "A位（acceptor，氨基酰位）：tRNA携带新氨基酸结合的位点；P位（peptidyl，肽酰位）：合成的肽链所连tRNA所在位点；E位（exit，排出位）：tRNA释放位点。" },
          { front: "翻译的三个阶段", back: "起始：带甲硫氨酸的起始tRNA连同mRNA结合到核糖体小亚基上形成翻译起始复合物；延长：分进位（氨基酰-tRNA进入A位）、成肽（P位tRNA上的多肽与A位tRNA上的氨基酸形成肽键，由转肽酶催化）、转位（A位的多肽连同mRNA进入P位）三步；终止：A位出现终止密码时，RF-1、RF-2调节肽链合成终止。" },
          { front: "tRNA的结构", back: "长约70~90个核苷酸，3’端核苷酸序列为CCA。" },
          { front: "多肽链合成后的加工修饰", back: "（1）切除N端甲硫氨酸；（2）通过氢键、二硫键形成二级结构；（3）共价修饰：磷酸化、甲基化等；（4）切除非功能片段。" },
          { front: "DNA复制的特点", back: "（1）边解旋、边合成、边复旋，多个起始点同时进行，节省时间、效率高；（2）新DNA分子双链为“一母一子”，使生物前后代保持一定的连续性。" },
          { front: "A部位与P部位", back: "A部位：氨酰基部位或受位，主要位于核糖体大亚基上，是接受氨酰基-tRNA的部位；P部位：肽酰基部位或供位，主要位于核糖体小亚基上，是肽酰基-tRNA移交肽链后tRNA释放的部位。" },
          { front: "多聚核糖体", back: "蛋白质合成时大小亚基必须结合在一起才能发挥作用，常常是多个核糖体结合在一条mRNA分子上，称为多聚核糖体。" },
          { front: "转座子", back: "从染色体的一个位置转移到另一位置或者在不同染色体之间移动的基因，又称移动基因。" },
          { front: "间隔基因", back: "基因转录区中位于编码基因之间的、与蛋白质翻译无关的序列。" },
          { front: "重叠基因", back: "同一DNA序列中2个基因的核苷酸序列相互重叠。" },
          { front: "遗传密码", back: "mRNA上相邻的3个碱基排列形成一个密码子，一个密码子决定一种氨基酸的形成，所有密码子统称遗传密码。" },
          { front: "翻译", back: "mRNA从细胞核进入细胞质后，在核糖体上进行蛋白质合成的过程。" },
          { front: "甲基绿和派洛宁染色", hot: true, back: "甲基绿使DNA染成绿色，派洛宁使RNA染成红色，据此显示DNA和RNA在细胞中的分布。" },
        ],
      },
      {
        name: "细胞生长与增殖",
        cards: [
          { front: "细胞增殖", back: "细胞通过生长和分裂获得具有与母细胞相同遗传特征的子代细胞、使细胞数目成倍增加的过程。细胞的分裂有三种形式：无丝分裂、有丝分裂、减数分裂。" },
          { front: "细胞周期", hot: true, back: "连续分裂的细胞从上一次有丝分裂结束到下一次有丝分裂完成所经历的整个连续过程，包含G1期、S期、G2期、M期四个阶段。G1、S、G2合称间期，M期即分裂期。" },
          { front: "G0期", back: "具有分裂能力的细胞在反复分裂数次之后处于停止分裂状态的时期。持续分裂的细胞称为周期中细胞。" },
          { front: "G1期、S期、G2期的特点", back: "G1期：从有丝分裂完成到DNA复制前，rRNA、tRNA合成活跃，中心粒开始复制，膜转运功能加强，细胞体积迅速增大；S期：DNA复制，大量组蛋白合成；G2期：DNA复制完成到有丝分裂开始前，大量微管蛋白合成，中心粒体积增大。" },
          { front: "无丝分裂的特点", back: "核仁、核膜始终存在；没有纺锤丝的形成；遗传物质的分配可能不均等。" },
          { front: "有丝分裂器", back: "由纺锤体和围绕中心粒的星体组成的结构；广义上在中期细胞中由染色体、星体、中心粒及纺锤体组成。中期以后的染色体分离、向两极移动及平均分配到子代，有丝分裂器起关键作用。" },
          { front: "纺锤体的主要元件", back: "极间微管、动粒微管、星体微管、区间微管。" },
          { front: "有丝分裂的过程", hot: true, back: "前期：染色质凝集、折叠和螺旋成染色体，分裂极确定，核仁、核膜解体（核仁核膜解体标志前期结束，由核纤层蛋白磷酸化变为可溶状态导致）；前中期：染色体进一步凝集形成X形结构，纺锤体微管与着丝粒结合形成着丝粒微管；中期：染色体的着丝点排列在赤道板上；后期：染色体在纺锤体微管牵引下移向两极；末期：两组子染色体到达两极并解螺旋成染色质细丝，核膜、核仁重新出现。" },
          { front: "胞质分裂", back: "细胞赤道板周围形成分裂沟，分裂沟内侧大量肌动蛋白和肌球蛋白组装成微丝束，称为收缩环。" },
          { front: "染色体移动假说", back: "微管解聚说和微管滑动说。" },
          { front: "减数分裂", back: "性细胞分裂时，染色体只复制一次，细胞连续分裂两次，染色体数目减半的一种特殊分裂方式。" },
          { front: "减数分裂的意义", back: "孟德尔分离定律和自由组合定律的细胞学基础。既保持人类染色体数目的相对稳定，又保证人类遗传特性的相对稳定，同时是生物变异和进化的基础。" },
          { front: "减数分裂前期Ⅰ的五个阶段", back: "细线期（染色质凝集）、偶线期（同源染色体配对即联会，形成二价体/四分体，出现联会复合体）、粗线期（联会复合体中出现重组节）、双线期（同源染色体非姐妹染色单体之间出现交叉）、终变期（交叉向染色体端部移行，即端化）。" },
          { front: "减数分裂Ⅰ的过程", back: "核膜破裂标志中期Ⅰ开始，四分体逐渐排列于赤道板上；后期Ⅰ同源染色体分离，在纺锤丝牵引下非同源染色体随机组合；末期Ⅰ染色体移至两极，解旋成细丝，核仁核膜重新形成。" },
          { front: "卵母细胞的减数分裂", back: "第一次减数分裂为不对称分裂，产生一个次级卵母细胞和一个极体。次级卵母细胞停留在中期Ⅱ，直到与精子受精才完成第二次减数分裂，形成一个卵细胞并排出第二极体。" },
          { front: "细胞周期调节的组成", back: "细胞周期的时序调节、DNA复制的调节、检查点调控三方面。" },
          { front: "细胞周期的调控因子", back: "细胞周期蛋白（cyclin）、细胞周期蛋白依赖性激酶（CDK）、细胞周期蛋白依赖性激酶抑制物（CDKI）、泛素等，这些基因称细胞分裂周期基因（CDC）。Cyc为调节亚基，Cdk为催化亚基（驱动细胞周期的关键）：G1期CycD-Cdk4/6和CycE-Cdk2，S期和G2期CycA-Cdk2，M期CycA/B-Cdk1。" },
          { front: "细胞周期检验点", hot: true, back: "检查和控制细胞周期进程的信号通路，在细胞周期出现问题时能阻止细胞周期，同时启动DNA修复、细胞凋亡等机制。共4个：G1-S检查点（酵母称start点、哺乳动物称R点，控制由静止G1进入DNA合成期，检测DNA是否损伤、胞外环境是否适宜）；S期检查点（检测DNA复制是否完整、是否多次复制）；G2/M检查点（暂停进入分裂阶段，修复损伤DNA）；中/后期检查点（保证中期染色体在赤道板正确排列，纺锤体组装完成前不启动染色单体分离）。" },
          { front: "肿瘤细胞的细胞周期特点", back: "（1）不受周期调控因子调控，以非正常速度生长分裂；（2）携带突变基因使应凋亡的细胞继续存活；（3）端粒较稳定，不受端粒退化而限制分裂次数的抑制。" },
          { front: "限制点（Restriction point）", back: "正常细胞G1期的某些特殊调节点，起控制细胞增殖周期开关的作用。" },
          { front: "MPF（有丝分裂促进因子）", back: "M期细胞质中能使间期细胞提前进入M期的成分，是调节细胞进出M期所必需的蛋白质激酶，通过促进靶蛋白磷酸化而改变其生理活性。" },
          { front: "生长因子", back: "一大类与细胞增殖有关的多肽类信号物质。多数有促进细胞增殖的功能，少数兼具双重调节作用：促进一类细胞增殖而抑制另一类。" },
          { front: "联会", back: "减数分裂偶线期同源染色体发生配对的现象，结果每对染色体形成一个紧密相伴的二价体。" },
          { front: "CDK（细胞周期蛋白依赖性蛋白激酶）", back: "一类必须与细胞周期蛋白结合后才具有激酶活性的蛋白激酶，通过磷酸化在细胞周期调控中起关键作用，能随细胞周期进程周期性出现及消失。" },
          { front: "细胞周期检测点", back: "为保证染色体数目的完整性及细胞周期正常运转，细胞中存在的一系列监控系统，对细胞周期的重要事件及出现的故障加以检测，只有当事件完成或故障修复后才允许细胞周期继续进行。" },
        ],
      },
      {
        name: "细胞信号转导",
        cards: [
          { front: "信号转导", back: "胞外信号分子通过与胞膜上或胞内的受体特异性结合，将信号转换后传给相应的胞内系统，使细胞作出适当反应的过程。即细胞接受外界信号刺激后，通过细胞膜上或胞内受体转换为细胞内信号，引发一系列生化反应及蛋白质间相互作用，直至产生生理反应所需的基因表达。" },
          { front: "信号转导的构成成分", back: "信号分子、受体、G蛋白、第二信使以及蛋白激酶、磷酸酶。" },
          { front: "细胞间信息物质", back: "由细胞分泌的调节靶细胞生命活动的化学物质，三大类：激素（内分泌细胞分泌，长距离、长时效）；局部化学介质（旁分泌信号经扩散作用于附近靶细胞、自分泌信号作用于自身，短距离、长时效）；神经递质（神经元突触前膜释放，短距离、短时间）。" },
          { front: "第二信使", back: "第一信使与受体作用后在细胞内最早产生的信号分子，包括cAMP、cGMP、三磷酸肌醇（IP3）、二酰基甘油（DG/DAG）等。功能：信号转换、启动和协助细胞内信号的逐级放大。" },
          { front: "第二信使的种类", back: "无机盐：Ca2+；脂类衍生物：DAG、N-脂酰鞘氨醇；糖类衍生物：IP3；核苷酸：cAMP、cGMP。" },
          { front: "受体", back: "存在于细胞膜上或细胞内，能特异识别并结合生物信息分子（外界信号），将信号转化为细胞内一系列生物化学反应、从而对细胞结构或功能产生影响的蛋白质分子。分为膜受体和细胞内受体。能与受体特异性结合的生物活性分子称配体。" },
          { front: "配体", back: "受体所接受的外界信号，包括神经递质、激素、生长因子、光子、某些化学物质及其他细胞外信号。" },
          { front: "膜受体的分类", back: "①环状受体（配体依赖性离子通道），受神经递质调节使离子通道开放或关闭；②七次跨膜α螺旋受体（G蛋白偶联受体）；③单次跨膜螺旋受体。" },
          { front: "单次跨膜螺旋受体的分类", back: "①酪氨酸蛋白激酶受体（配体：胰岛素、多种生长因子如EGF、PDGF、NGF等）——与配体结合后表现酪氨酸蛋白激酶活性，催化自身和底物Tyr磷酸化；②非催化型单个跨膜受体（细胞因子受体，配体：生长激素、干扰素、白细胞介素）——与配体结合后与酪氨酸蛋白激酶耦联表现酶活性；③蛋白丝氨酸/苏氨酸激酶受体（配体：转化生长因子-βs）；④鸟苷酸环化酶活性受体（配体：NO、心钠素、鸟苷素）。" },
          { front: "细胞内受体", back: "带有DNA结合区，能与DNA结合启动转录，相应配体有类固醇激素、甲状腺素、脂溶性维生素、维甲酸（维A酸）。" },
          { front: "受体作用特点", back: "高度专一性、高度亲和力、可饱和性、可逆性、特定的作用模式。" },
          { front: "受体活性调节", back: "分为上调和下调，常见机制：磷酸化与去磷酸化；膜磷脂代谢的影响；酶促水解作用；G蛋白调节。" },
          { front: "G蛋白", back: "全称鸟苷酸结合蛋白，能与鸟苷酸结合的一类蛋白质的总称。由α、β、γ三个亚基构成的异三聚体，能与GTP和GDP结合，具有GTP酶活性，能将GTP分解为GDP。通过自身构象改变激活效应蛋白，实现把细胞外信号传入细胞内。有三大家族：Gi（抑制效应蛋白）、Gs（激活效应蛋白）、Gq。位于细胞膜胞质面，为可溶性膜外周蛋白。" },
          { front: "G蛋白的作用机制", back: "静息状态：G蛋白以异三聚体形式存在于细胞膜上，与GDP结合，与受体分离。配体与受体结合→受体构象改变→G蛋白α亚基与受体结合→α亚基与GDP亲和力下降、与GTP亲和力增加→α亚基结合GTP并发生构象改变→α亚基与β、γ亚基分离，并从受体上解离成为游离α亚基（功能状态），调节效应蛋白活性。信号解除后，α亚基发挥GTP酶活性分解GTP为GDP，与效应蛋白分离，α亚基与β、γ亚基重新结合，回复静息状态。" },
          { front: "以cAMP为例简述G蛋白的作用机制", back: "静息时G蛋白以异三聚体形式处在细胞膜表面、与GDP结合，与受体分离，腺苷酸环化酶（AC）无活性。配体与受体结合→受体构象改变→G蛋白与受体结合→α亚基与GDP亲和力下降、与GTP亲和力增强→α亚基结合GTP引起构象改变，暴露出与AC结合位点→α亚基与β、γ亚基分离，游离的α亚基与AC结合并使其活化→AC催化ATP生成cAMP。信号解除后，α亚基发挥GTP酶活性分解GTP生成GDP，与AC分离终止其活性，α与β、γ重新结合回复静息状态。" },
          { front: "级联反应", back: "催化某一步反应的蛋白质由上一步反应的产物激活或抑制。好处：一系列酶促反应仅通过单一种类化学分子就可调节；使信号分子得到逐渐放大。" },
          { front: "G蛋白偶联受体", back: "一种膜蛋白受体，可激活G蛋白，介导许多细胞外信号的传导。结构特征：一条多肽链构成，7个跨膜α螺旋区；N端朝向胞外，C端朝向胞内；N端有糖基化位点，C端第三袢环和C端有磷酸化位点。" },
          { front: "腺苷酸环化酶（AC）", back: "G蛋白的效应蛋白，可催化ATP生成cAMP，是cAMP信号传递系统的关键酶。" },
          { front: "第一信使", back: "细胞外信号分子。" },
          { front: "第二信使的下游通路", back: "cAMP（由腺苷酸环化酶催化ATP生成）→激活PKA；cGMP（由鸟苷酸环化酶催化GTP生成）→激活PKG；DAG（磷脂代谢产生）→激活PKC；IP3（磷脂代谢产生）→作用于细胞内钙库；Ca2+→结合钙调蛋白（CaM）。cAMP/cGMP由环核苷酸磷酸二酯酶（PDE）催化分解。" },
          { front: "蛋白激酶的种类", back: "蛋白激酶A（PKA）：丝氨酸蛋白激酶；蛋白激酶G（PKG）：cGMP依赖的蛋白激酶；蛋白激酶C（PKC）：丝/苏氨酸蛋白激酶；蛋白激酶B（PKB）：丝/苏氨酸蛋白激酶；钙调蛋白依赖性蛋白激酶；丝裂原激活蛋白激酶：细胞内级联放大的重要系统之一，催化丝/苏氨酸磷酸化。" },
          { front: "cAMP-蛋白激酶A途径", back: "激素与受体结合→激素-受体复合物使Gs蛋白释放GDP，α亚基与β、γ亚基解聚→游离α亚基结合GTP成为活性形式Gsα→Gsα激活AC→AC催化合成cAMP→cAMP激活PKA→PKA催化底物磷酸化产生化学效应。PKA由两个催化亚基和两个调节亚基组成：cAMP与调节亚基结合使调节亚基与催化亚基解离，释放出催化亚基，激活PKA；活化的催化亚基进入细胞核，使CREB（cAMP应答结合蛋白）磷酸化，磷酸化的基因调控蛋白与靶基因调控序列结合，增强靶基因表达。" },
          { front: "信号转导的共同特性", back: "信号分子活化及存在的暂时性；信号分子活性的可逆性；聚合和解聚是信号传递的通用形式；蛋白质磷酸化与去磷酸化是信号分子激活的基本途径；信号通路的连贯性与放大作用；信号转导途径的专一性与通用性。" },
          { front: "信号转导异常导致的疾病", back: "受体病、G蛋白异常疾病、蛋白激酶异常疾病（即信号转导的非信号构成成分出问题）。" },
          { front: "细胞表面受体的主要种类和基本特点", back: "主要种类：离子通道偶联受体、G蛋白偶联受体、酶联受体。特点：受体的特异性及其非绝对性；可饱和性；高亲和力；可逆性；特定的作用模式。" },
          { front: "cAMP通路的组成、特点及功能", back: "cAMP的产生由细胞膜中的刺激型受体、抑制型受体、Gs、Gi和腺苷酸环化酶5种组分控制。cAMP可被特异的环核苷酸磷酸二酯酶（PDE）迅速水解为5’-AMP而失去信号功能。主要功能：cAMP调节细胞中糖原分解；cAMP-PKA对真核细胞基因表达的调控。" },
        ],
      },
      {
        name: "细胞分化",
        cards: [
          { front: "细胞分化", hot: true, back: "由一个受精卵产生的同源后代细胞，在形态、结构、功能、蛋白合成等方面逐渐发生稳定性差异的过程。" },
          { front: "细胞分化的特点", back: "时空性、稳定性和不可逆性。时空性：细胞分化潜能随个体发育降低，细胞分裂次数越多分化能力越低；稳定性、不可逆性：分化了的细胞保持分化后结构和功能的稳定。" },
          { front: "三胚层的分化去向", back: "内胚层：消化道、消化腺（唾液腺、胰腺、肝脏）、肺泡上皮；中胚层：骨骼、肌肉、纤维组织、真皮、心血管系统、泌尿系统；外胚层：神经系统、表皮。" },
          { front: "细胞分化的决定因素", back: "（1）细胞发育及分化程度决定细胞分化；（2）基因选择表达决定细胞分化：DNA甲基化修饰和组蛋白乙酰化、甲基化、磷酸化修饰；管家基因和奢侈基因——奢侈基因甲基化程度影响决定细胞特性的基因差异表达；同源框基因将空间特异性赋予身体前后轴不同部位的细胞。" },
          { front: "胚胎诱导", back: "诱导是一部分细胞诱导其他细胞向特定方向分化的现象，也叫胚胎诱导。" },
          { front: "细胞分化的影响因素", back: "（1）激素是远距离细胞间相互作用的分化调节因子；（2）环境因素包括物理、化学、生物等因素。" },
          { front: "去分化", back: "某些条件下分化的细胞失去原有的分化结构和功能成为未分化细胞的过程。" },
          { front: "转分化", back: "起源于同一祖细胞的各种终末分化细胞相互之间分化状态转化的现象。" },
          { front: "再分化", back: "再生的基础。再生过程中，有些细胞首先要发生去分化，然后发生再分化，实现再生功能。" },
          { front: "按再生能力划分的细胞类型", back: "不稳定性细胞：再生能力很强；稳定性细胞：有较强的潜在再生能力；永久性细胞：不具有再生能力。" },
          { front: "再生的三种方式", back: "微变态再生：去分化、再分化；变形再生：已存在组织的重组分化；补偿性再生：细胞分裂，产生相似细胞。" },
          { front: "管家基因", hot: true, back: "维持细胞最低限度的功能所必不可少的基因，但对细胞分化一般只有协助作用。" },
          { front: "奢侈基因", hot: true, back: "与各种分化细胞的特殊性状有直接关系的基因，丧失这类基因对细胞的生存并无直接影响。" },
          { front: "决定（determination）", back: "细胞从分化方向确定开始到出现特异形态特征之前这一时期，称为决定。" },
          { front: "细胞全能性", back: "单个细胞在一定条件下增殖、分化发育成为完整个体的能力。" },
          { front: "抑制", back: "胚胎发育中，分化的细胞受到邻近细胞产生抑制物质的影响。" },
          { front: "同源框基因", back: "一种同源异型基因，在胚胎发育过程中将空间特异性赋予身体前后轴不同部位的细胞，进而影响细胞分化。" },
          { front: "卵裂", back: "多细胞动物早期胚胎，自受精卵至囊胚早期的细胞有丝分裂。此阶段胚胎的体积与受精卵差别不大。" },
        ],
      },
      {
        name: "细胞衰老与死亡",
        cards: [
          { front: "细胞衰老", back: "细胞的形态结构、化学成分和生理功能逐渐衰退并趋向死亡的现象。细胞总体衰老反映机体衰老，机体衰老以细胞衰老为基础。" },
          { front: "按寿命划分的细胞类型", back: "快速更新细胞：表皮基底层细胞、小肠绒毛上皮细胞；缓慢更新细胞：肝细胞、胃壁细胞；长寿命细胞：神经细胞、脂肪细胞、肌细胞。" },
          { front: "Hayflick界限", back: "关于细胞增殖能力和寿命有限的观点：细胞（至少培养的二倍体细胞）不是不死的，而是有一定的寿命；增殖能力不是无限的，而是有一定的界限。体外培养细胞的增殖能力与细胞传代次数、细胞物种的寿命、细胞供体的年龄有一定关系。" },
          { front: "细胞衰老的形态学改变", back: "（1）细胞皱缩，原生质失水，体积变小；（2）膜脂、膜蛋白交联，膜通透性、脆性、黏度增加，流动性降低；（3）细胞核增大，核膜内折，染色质固缩；（4）细胞器结构数量改变，如高尔基体破碎、线粒体变大；（5）细胞结构与功能呈退行性变化，如出现脂褐素。" },
          { front: "细胞衰老的化学改变", back: "（1）核酸：DNA复制、转录和修复能力受抑制，端粒缺失，mRNA和tRNA含量降低；（2）蛋白质：合成能力降低，蛋白质交联变性；（3）酶：金属离子丢失导致酶失活。" },
          { front: "细胞衰老学说", back: "遗传程序学说（重复基因利用枯竭；DNA修复能力下降；端粒钟学说/衰老基因说）和细胞磨损学说（差错灾难学说；大分子交联学说；自由基学说）。" },
          { front: "细胞死亡", back: "细胞生命现象不可逆的终结。分为细胞坏死和细胞凋亡。" },
          { front: "细胞坏死", back: "细胞对外来伤害的一种被动、无规则反应，是突发性的病理性死亡，一般由于感染等因素造成，往往伴随炎症。" },
          { front: "细胞凋亡", hot: true, back: "又称程序性细胞死亡（PCD）：细胞在一定的生理或病理条件下，主动的、由基因控制的细胞自主有序死亡过程，涉及一系列基因激活、表达及调控，不发生炎症。1972年由Kerr提出。" },
          { front: "细胞凋亡的形态学特征", back: "（1）细胞质脱水皱缩，细胞密度增加；细胞器空泡化；细胞骨架由疏松有序变为致密紊乱；（2）染色质凝聚、分块；核纤层断裂解体，核膜断裂；（3）细胞膜特化结构消失，皱缩内陷，磷脂酰丝氨酸出现在细胞膜上；（4）凋亡小体形成（发泡或出芽脱落机制、分割机制、自噬体形成机制）。" },
          { front: "细胞凋亡的生化特征", back: "（1）内源性核酸内切酶活化致使DNA片段化；（2）蛋白酶级联反应；（3）胞内Ca2+库释放和胞外Ca2+内流使Ca2+浓度升高；（4）线粒体释放活性氧和细胞色素C。" },
          { front: "细胞凋亡的意义", back: "（1）参与发育过程中错位、迷途和多余细胞的清除；（2）参与免疫系统的调节；（3）参与机体损伤、衰老和突变细胞的清除。" },
          { front: "细胞凋亡与细胞坏死的区别", hot: true, back: "凋亡：生理或病理性信号诱导；基因调控；细胞皱缩变小；细胞质皱缩、由质膜包围形成凋亡小体；细胞核固缩；基因组DNA规律性片段化、电泳呈梯状；细胞膜保持完整直到形成凋亡小体；溶酶体完整；需要效应蛋白质合成；有凋亡小体；单个散在细胞；无炎症反应；是个体存活需要。坏死：强烈刺激病理性信号；非基因调控；细胞肿胀变大；细胞质溢出破碎；细胞核弥漫性降解；基因组DNA随机降解、电泳呈散状；细胞膜破损；溶酶体破碎；不需效应蛋白质合成；无凋亡小体；成群细胞或大片组织；有炎症反应；是破坏作用。" },
          { front: "细胞凋亡的诱导因素", back: "免疫细胞、免疫分子、生长抑制因子、营养缺乏、缺氧、理化生因素。" },
          { front: "细胞凋亡的抑制因素", back: "生长因子、癌基因表达、蛋白酶抑制剂、抗氧化物质。" },

          { front: "干细胞的形态特征", back: "呈圆形或椭圆形，体积小，核质比例大，膜性细胞器不发达。" },
          { front: "干细胞的生化特征", back: "细胞增殖相关基因活跃，端粒酶活性高，有特殊的生化标志。" },
          { front: "干细胞的增殖特征", back: "缓慢性（经过渡放大细胞）和自稳定性：对称分裂（子细胞全是干细胞或全是分化细胞）与不对称分裂（一个干细胞、一个分化细胞）。" },
          { front: "干细胞的分化特征", back: "多分化潜能性、可塑性（转分化和去分化）。" },

          { front: "胚胎干细胞的获得途径", back: "①体外受精胚胎囊胚期内细胞团；②终止妊娠胎儿的原始生殖嵴组织；③去核卵细胞经体细胞核移植后发育成囊胚，再取其内层细胞。" },
          { front: "胚胎干细胞的形态特征", back: "较小，核质比高，胞核明显，一个或多个核仁，除核糖体外其他细胞器很少。" },
          { front: "胚胎干细胞的生化特征", back: "含Oct-4表达产物；表达阶段性胚胎细胞表面抗原（SSEA-1、SSEA-3、SSEA-4）；其他标记分子如碱性磷酸酶。" },
          { front: "胚胎干细胞的增殖分化特征", back: "可无限增殖；可长期保持原始未分化状态；可分化成为各类组织细胞。" },
          { front: "成体干细胞的类型", back: "造血干细胞（CD34+）、间充质干细胞、神经干细胞（神经巢蛋白）、表皮干细胞（整合素）等（括号内为生物学标志）。" },
          { front: "干细胞的应用", back: "（1）细胞治疗：胚胎干细胞用于个体和器官克隆、基因功能研究；成体干细胞用于白血病、血液病的干细胞治疗及神经疾病、损伤修复治疗。（2）组织工程。（3）药物筛查和疗效评价。" },
          { front: "全能、多能、专能、单能干细胞", back: "全能干细胞：具有自我更新和分化形成任何类型细胞的能力，能发育成完整个体（受精卵和8细胞期之前的每一个胚胎细胞都是全能干细胞）；多能干细胞：囊胚内细胞团细胞，具分化为成熟个体所有细胞类型的潜能，但不能形成完整个体；专能干细胞：由多能干细胞分化而来的具有特殊功能的细胞群体；单能干细胞：只能产生一种类型细胞的干细胞。" },
          { front: "对称分裂与不对称分裂", back: "对称分裂：干细胞分裂产生同类型细胞（两个子细胞都是干细胞或都是分化细胞）；不对称分裂：产生不同类型细胞（一个是干细胞、另一个是分化细胞）。" },
          { front: "过渡放大细胞", back: "干细胞分裂时须经过快速增殖期产生过渡放大细胞。介于干细胞和分化细胞之间，分裂较快，经过若干次分裂后产生分化细胞；作用是通过较少的干细胞产生较多的分化细胞。" },
          { front: "再生", back: "生物体受损后组织或器官在原有基础上重新形成已失去部分的过程，也是修复的一种。" },
          { front: "成体干细胞", back: "出现在已特化组织中的未分化细胞，能够自我更新，并能分化产生该组织的各种特化类型细胞。" },
        ],
      },
      {
        name: "肿瘤细胞",
        cards: [
          { front: "肿瘤细胞的显著特征", back: "不死性、迁移性和失去接触抑制。" },
          { front: "良性肿瘤与恶性肿瘤的区别", back: "良性：生长缓慢，排列整齐且分化良好，有包膜、边界清楚，无侵袭和转移。恶性：生长快速，核质比例高，无包膜、边界不清，向周围组织浸润性生长和迁移。" },
          { front: "肿瘤细胞的基本特征", back: "（1）异常形态结构：细胞骨架微丝减少、微管变短、骨架紊乱；细胞核核质比例高，巨核、双核或多核，染色质核周聚集；超微结构内质网、高尔基复合体畸形，线粒体肿胀、嵴减少。（2）异常生物学行为：增殖自主和不成熟；生存独立；侵袭和转移性。（3）异常生化代谢：细胞膜膜脂膜糖膜蛋白改变，表面具较高负电荷；主要通过糖酵解获取能量；端粒酶活性增高。" },
          { front: "癌基因", back: "控制细胞生长和分裂的正常基因突变的一种形式，能引起正常细胞癌变。分为病毒癌基因（通过逆转录和重组诱导正常细胞恶性转化）和原癌基因（在细胞基本生命过程中行使重要功能）。具体有：表达生长因子类、表达生长因子受体类、表达非受体酪氨酸蛋白激酶类、表达丝氨酸/苏氨酸蛋白激酶类、表达G蛋白类、表达核转录因子蛋白类。" },
          { front: "抑癌基因", back: "存在于细胞基因组内的一类能抑制细胞恶性转化的核苷酸序列。" },
        ],
      },
    ],
  },
];
  </script>
  <script>
    // ============ 知识点闪卡 逻辑 ============
    // 知识点在上方 SUBJECTS 数组中编辑（格式说明见 data 区块顶部注释）。
    // 学习进度保存在 localStorage（fc-state-<科目id>），导入的科目保存在 fc-imported-subjects。
    (function () {
      "use strict";

      // ---------- 存储键 ----------
      var STORAGE_IMPORTED = "fc-imported-subjects";
      var STORAGE_STATE_PREFIX = "fc-state-";
      var STORAGE_THEME = "fc-theme";

      // ---------- DOM ----------
      var $ = function (sel) { return document.querySelector(sel); };
      var subjectChapter = $("#subjectChapter");
      var statsBar = $("#statsBar");
      var onlyUnmastered = $("#onlyUnmastered");
      var onlyHot = $("#onlyHot");
      var cardWrap = $("#cardWrap");
      var card = $("#card");
      var emptyTip = $("#emptyTip");
      var frontText = $("#frontText");
      var backText = $("#backText");
      var frontBadge = $("#frontBadge");
      var backBadge = $("#backBadge");
      var chapterTag = $("#chapterTag");
      var hotBadge = $("#hotBadge");
      var progressEl = $("#progress");
      var prevBtn = $("#prevBtn");
      var nextBtn = $("#nextBtn");
      var masteredBtn = $("#masteredBtn");
      var unmasteredBtn = $("#unmasteredBtn");
      var importBtn = $("#importBtn");
      var importFile = $("#importFile");
      var importMsg = $("#importMsg");
      var themeBtn = $("#themeBtn");

      // ---------- 状态 ----------
      var subjects = loadSubjects();
      var currentSubject = subjects[0] || null;
      var chapterFilter = "all"; // "all" 或章节下标
      var pool = [];             // 当前筛选后的卡片 [{chIdx, cIdx, card}]
      var pos = 0;
      var history = [];          // 「上一张」历史（pool 下标）
      var state = loadState();   // { "chIdx-cIdx": "mastered" | "unmastered" }

      // ---------- 数据读写 ----------
      function loadSubjects() {
        var builtin = SUBJECTS.map(function (s) {
          return Object.assign({}, s, { imported: false });
        });
        var imported = [];
        try {
          imported = JSON.parse(localStorage.getItem(STORAGE_IMPORTED)) || [];
        } catch (e) { imported = []; }
        return builtin.concat(imported.map(function (s) {
          return Object.assign({}, s, { imported: true });
        }));
      }

      function persistImported() {
        localStorage.setItem(STORAGE_IMPORTED, JSON.stringify(subjects.filter(function (s) { return s.imported; })));
      }

      function stateKey() { return STORAGE_STATE_PREFIX + currentSubject.id; }

      function loadState() {
        if (!currentSubject) return {};
        try {
          return JSON.parse(localStorage.getItem(stateKey())) || {};
        } catch (e) { return {}; }
      }

      function saveState() {
        if (!currentSubject) return;
        localStorage.setItem(stateKey(), JSON.stringify(state));
      }

      function getStatus(item) {
        return state[item.chIdx + "-" + item.cIdx] || "none";
      }

      function setStatus(item, s) {
        if (s === "none") delete state[item.chIdx + "-" + item.cIdx];
        else state[item.chIdx + "-" + item.cIdx] = s;
        saveState();
      }

      // ---------- 深色模式 ----------
      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        themeBtn.textContent = theme === "dark" ? "浅色模式" : "深色模式";
        try { localStorage.setItem(STORAGE_THEME, theme); } catch (e) {}
      }
      var savedTheme = null;
      try { savedTheme = localStorage.getItem(STORAGE_THEME); } catch (e) {}
      applyTheme(savedTheme === "dark" ? "dark" : "light");
      themeBtn.addEventListener("click", function () {
        var cur = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
        applyTheme(cur === "dark" ? "light" : "dark");
        this.blur();
      });

      // ---------- 渲染 ----------
      function renderSubjectSelect() {
        subjectChapter.innerHTML = "";
        subjects.forEach(function (s) {
          var og = document.createElement("optgroup");
          og.label = s.name;
          var all = document.createElement("option");
          all.value = s.id + "::all";
          all.textContent = "全部章节";
          og.appendChild(all);
          s.chapters.forEach(function (ch, i) {
            var o = document.createElement("option");
            o.value = s.id + "::" + i;
            o.textContent = ch.name;
            og.appendChild(o);
          });
          subjectChapter.appendChild(og);
        });
        if (currentSubject) {
          subjectChapter.value = currentSubject.id + "::" + chapterFilter;
        }
      }

      function rebuildPool() {
        pool = [];
        history = [];
        if (!currentSubject) return;
        currentSubject.chapters.forEach(function (ch, chIdx) {
          if (chapterFilter !== "all" && String(chIdx) !== String(chapterFilter)) return;
          ch.cards.forEach(function (card, cIdx) {
            var item = { chIdx: chIdx, cIdx: cIdx, card: card };
            if (onlyUnmastered.checked && getStatus(item) === "mastered") return;
            if (onlyHot.checked && !card.hot) return;
            pool.push(item);
          });
        });
        if (pos >= pool.length) pos = pool.length - 1;
        if (pos < 0) pos = 0;
      }

      // 解释文本：分点（①②③、⑴⑵⑶、（A. 等）各起一行
      function formatBack(text) {
        if (!text) return "";
        return text
          .replace(/(?=[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳])/g, "\n")
          .replace(/(?=（\d+）)/g, "\n")
          .replace(/(?=（[A-F]\.）)/g, "\n")
          .split("\n")
          .map(function (s) { return s.trim(); })
          .filter(Boolean)
          .join("\n");
      }

      function setFlipped(v) {
        card.classList.toggle("flipped", v);
      }

      function renderCard() {
        var empty = pool.length === 0;
        cardWrap.classList.toggle("hidden", empty);
        emptyTip.classList.toggle("hidden", !empty);
        if (empty) {
          progressEl.textContent = "0 张卡片";
          return;
        }
        var item = pool[pos];
        var ch = currentSubject.chapters[item.chIdx];
        var st = getStatus(item);

        setFlipped(false); // 换卡自动翻回正面
        frontText.textContent = item.card.front;
        backText.textContent = formatBack(item.card.back || "（暂无解释）");
        backText.scrollTop = 0;

        chapterTag.textContent = ch.name;
        hotBadge.style.display = item.card.hot ? "" : "none";
        var badgeText = st === "mastered" ? "✔ 已掌握" : (st === "unmastered" ? "✘ 未掌握" : "");
        [frontBadge, backBadge].forEach(function (b) {
          b.textContent = badgeText;
          b.className = "status-badge " + st;
        });

        progressEl.textContent = "第 " + (pos + 1) + " / " + pool.length + " 张 · " + ch.name;

        masteredBtn.classList.toggle("active", st === "mastered");
        unmasteredBtn.classList.toggle("active", st === "unmastered");
      }

      function renderStats() {
        var m = 0, u = 0, total = 0;
        if (currentSubject) {
          currentSubject.chapters.forEach(function (ch, chIdx) {
            ch.cards.forEach(function (c, cIdx) {
              total++;
              var st = state[chIdx + "-" + cIdx];
              if (st === "mastered") m++;
              else if (st === "unmastered") u++;
            });
          });
        }
        statsBar.innerHTML =
          '<span class="stat">总卡片 <b>' + total + "</b></span>" +
          '<span class="stat">已掌握 <b class="num-mastered">' + m + "</b></span>" +
          '<span class="stat">未掌握 <b class="num-unmastered">' + u + "</b></span>";
      }

      // ---------- 行为 ----------
      function flip() {
        if (pool.length === 0) return;
        card.classList.toggle("flipped");
      }

      function goPrev() {
        if (pool.length === 0 || history.length === 0) return;
        pos = history.pop();
        renderCard();
      }

      function goNext() { // 下一张：默认乱序（随机抽取，不与当前张重复）
        if (pool.length === 0) return;
        history.push(pos);
        if (history.length > 200) history.shift();
        if (pool.length > 1) {
          var r;
          do { r = Math.floor(Math.random() * pool.length); } while (r === pos);
          pos = r;
        }
        renderCard();
      }

      function markCard(s) {
        if (pool.length === 0) return;
        var item = pool[pos];
        var cur = getStatus(item);
        setStatus(item, cur === s ? "none" : s); // 再次点击同一按钮 = 取消标记
        rebuildPool(); // 若开启「只看未掌握」，已掌握卡片会被移出
        renderStats();
        renderCard();
      }

      function selectSubject(sid, chVal) {
        var s = subjects.find(function (x) { return x.id === sid; });
        if (!s) return;
        var subjectChanged = !currentSubject || currentSubject.id !== sid;
        currentSubject = s;
        if (subjectChanged) state = loadState();
        chapterFilter = chVal || "all";
        pos = 0;
        renderSubjectSelect();
        rebuildPool();
        renderStats();
        renderCard();
      }

      // ---------- TXT 导入 ----------
      function parseTxt(text) {
        if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // 去掉 BOM
        var cards = [];
        text.split(/\r?\n/).forEach(function (raw) {
          var line = raw.trim();
          if (!line) return;
          var m = line.match(/^(.*?)[|｜：:]\s*(.*)$/);
          if (m && m[1].trim()) {
            cards.push({ front: m[1].trim(), back: m[2].trim() });
          } else {
            cards.push({ front: line, back: "" }); // 无分隔符的行只作正面
          }
        });
        return cards;
      }

      function showMsg(text) {
        importMsg.textContent = text;
        clearTimeout(showMsg._t);
        showMsg._t = setTimeout(function () { importMsg.textContent = ""; }, 6000);
      }

      importBtn.addEventListener("click", function () { importFile.click(); });

      importFile.addEventListener("change", function () {
        var file = importFile.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          var cards = parseTxt(String(reader.result));
          if (!cards.length) {
            showMsg("未能解析出卡片，请检查格式（每行：概念|解释 或 概念：解释）");
            return;
          }
          var subject = {
            id: "import-" + Date.now(),
            name: file.name.replace(/\.txt$/i, "") || "导入科目",
            chapters: [{ name: "默认分组", cards: cards }],
            imported: true
          };
          subjects.push(subject);
          persistImported();
          selectSubject(subject.id, "all");
          showMsg("已导入「" + subject.name + "」" + cards.length + " 张卡片");
        };
        reader.onerror = function () { showMsg("文件读取失败"); };
        reader.readAsText(file, "utf-8");
        importFile.value = "";
      });

      // ---------- 事件 ----------
      card.addEventListener("click", flip);
      prevBtn.addEventListener("click", function () { goPrev(); this.blur(); });
      nextBtn.addEventListener("click", function () { goNext(); this.blur(); });
      masteredBtn.addEventListener("click", function () { markCard("mastered"); this.blur(); });
      unmasteredBtn.addEventListener("click", function () { markCard("unmastered"); this.blur(); });
      subjectChapter.addEventListener("change", function () {
        var parts = subjectChapter.value.split("::");
        selectSubject(parts[0], parts[1] || "all");
      });
      onlyUnmastered.addEventListener("change", function () { pos = 0; rebuildPool(); renderCard(); });
      onlyHot.addEventListener("change", function () { pos = 0; rebuildPool(); renderCard(); });

      document.addEventListener("keydown", function (e) {
        if (e.target && e.target.matches("input, select, textarea, button")) return;
        if (e.code === "Space" || e.key === "Enter") { e.preventDefault(); flip(); }
        else if (e.key === "ArrowLeft") goPrev();
        else if (e.key === "ArrowRight") goNext();
        else if (e.key === "r" || e.key === "R") goNext();
      });

      // ---------- 初始化 ----------
      renderSubjectSelect();
      rebuildPool();
      renderStats();
      renderCard();
    })();
  </script>
</body>
</html>
